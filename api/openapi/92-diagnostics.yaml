    "/api/diagnostics/db-query": {
      "post": {
        "operationId": "post_api_diagnostics_db_query",
        "summary": "許可付きDB参照",
        "description": "期限付きdb-readの許可を実行時に共有DBで再確認する。SQL検査後、対象の検索パスをpg_catalog優先に設定したREAD ONLYトランザクションで1文のSELECTを実行する。statement_timeoutは5秒、lock_timeoutは500ms。同時実行は全対象で1件。認証済みの実行・拒否をactor・許可ID・対象・SQL全文・HTTP結果でadmin_auditに記録し、結果の値は保存しない。65536バイトを超えるSQLは実行せず、監査には先頭65536バイト以内とsqlBytes（元のバイト数）・sqlSha256（全文のSHA-256）を残す。",
        "security": [
          {
            "pcToken": []
          },
          {
            "cliKey": []
          }
        ],
        "x-issue-desk-delegate": true,
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "target",
                  "sql"
                ],
                "additionalProperties": false,
                "properties": {
                  "target": {
                    "type": "string",
                    "enum": [
                      "shared",
                      "app"
                    ]
                  },
                  "sql": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 65536,
                    "description": "UTF-8で65536バイト以下。SELECTまたはWITHから始まる1文のみ。資格情報・システム・対象外スキーマ・副作用のある関数を拒否。"
                  },
                  "maxRows": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 1000,
                    "default": 100
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "照会結果。JSON本文は改行を含め262144バイト以下。行または本文上限による省略はtruncatedで示す。値をテキストにした大きさが1行で262144バイトを超える行はDB側で値を返さず、その行の手前で打ち切ってtruncated.bytesをtrueにする。",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "columns",
                    "rows",
                    "truncated"
                  ],
                  "additionalProperties": false,
                  "properties": {
                    "columns": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "required": [
                          "name",
                          "type"
                        ],
                        "additionalProperties": false,
                        "properties": {
                          "name": {
                            "type": "string"
                          },
                          "type": {
                            "type": "string",
                            "description": "PostgreSQLのスカラー型名。composite・record・bytea・未知の型は拒否。"
                          }
                        }
                      }
                    },
                    "rows": {
                      "type": "array",
                      "maxItems": 1000,
                      "items": {
                        "type": "array",
                        "items": {
                          "type": [
                            "string",
                            "number",
                            "boolean",
                            "null"
                          ]
                        }
                      },
                      "description": "columnsと同じ順序。重複列名も保持する。numeric・JSONなどドライバーがbytesで返す値は文字列。空結果は空配列。"
                    },
                    "truncated": {
                      "type": "object",
                      "required": [
                        "rows",
                        "bytes"
                      ],
                      "additionalProperties": false,
                      "properties": {
                        "rows": {
                          "type": "boolean"
                        },
                        "bytes": {
                          "type": "boolean"
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "入力・SQL・結果の列名または型・列数（1〜1600）を拒否。PostgreSQLが照会の内容を理由に返すエラー（構文・名前・データ・行数・未対応の機能・大きさの上限・読取専用・ロック上限・メモリ不足）も含む。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "未認証または資格情報が無効。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "画面セッション、運用代行なしのPCトークン、または対象に有効な期限付きdb-readの許可がない。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "別のDB照会を実行中。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "DB接続または監査保存が利用不能、またはDB内部のエラー。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "504": {
            "description": "5秒のstatement_timeout、または接続待ちを含む6秒の要求上限を超過。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
