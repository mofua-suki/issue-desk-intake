{
  "paths": {
    "/api/diagnostics/db": {
      "get": {
        "operationId": "get_api_diagnostics_db",
        "summary": "受付診断: db",
        "description": "読み取り専用の受付診断。認証、認可の後にGETを処理する。",
        "x-issue-desk-delegate": true,
        "security": [
          {
            "pcToken": []
          },
          {
            "cliKey": []
          }
        ],
        "responses": {
          "200": {
            "description": "診断結果。",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "color",
                    "instanceId",
                    "startedAt",
                    "pid",
                    "queries",
                    "connections",
                    "maxConnections"
                  ],
                  "properties": {
                    "color": {
                      "type": "string",
                      "enum": [
                        "blue",
                        "green",
                        "unknown"
                      ]
                    },
                    "instanceId": {
                      "type": "string"
                    },
                    "startedAt": {
                      "type": "string",
                      "format": "date-time"
                    },
                    "pid": {
                      "type": "integer"
                    },
                    "queries": {
                      "type": "array",
                      "maxItems": 100,
                      "items": {
                        "type": "object",
                        "required": [
                          "state",
                          "seconds",
                          "waitType"
                        ],
                        "properties": {
                          "state": {
                            "type": "string"
                          },
                          "seconds": {
                            "type": "number",
                            "description": "実行時間（秒）。"
                          },
                          "waitType": {
                            "type": [
                              "string",
                              "null"
                            ],
                            "description": "待機種別。不明ならnull。"
                          },
                          "query": {
                            "type": "string",
                            "description": "正規化後のSQL。最大256バイトでトークン境界まで。権限不足、判別不能、診断接続のstandard_conforming_stringsがon以外、または通常文字列にバックスラッシュがあるときは省略。観測先の接続設定は取得できない。"
                          }
                        }
                      },
                      "description": "現在のDBのactive接続とstateが見えない接続の標本（最大100件）。権限不足ではidle接続もunknownとして含まれる。該当なしは空配列。"
                    },
                    "connections": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "required": [
                          "state",
                          "count"
                        ],
                        "properties": {
                          "state": {
                            "type": "string"
                          },
                          "count": {
                            "type": "integer"
                          }
                        }
                      },
                      "description": "該当なしは空配列。"
                    },
                    "maxConnections": {
                      "type": "integer"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "未認証または資格情報が無効。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "画面セッション、または運用代行を許可していないPCトークンなどは拒否。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "405": {
            "description": "認可後、GET以外は拒否。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "DB診断情報の読取に失敗。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/diagnostics/cpu": {
      "get": {
        "operationId": "get_api_diagnostics_cpu",
        "summary": "受付診断: cpu",
        "description": "読み取り専用の受付診断。認証、認可の後にGETを処理する。 上位件数はlimitで指定し既定30件、最大100件。要求取消しで接続が切れた場合は応答せず、取得枠を解放する。",
        "x-issue-desk-delegate": true,
        "security": [
          {
            "pcToken": []
          },
          {
            "cliKey": []
          }
        ],
        "parameters": [
          {
            "name": "seconds",
            "in": "query",
            "required": false,
            "description": "取得秒数。1回だけ指定でき、重複指定は拒否。",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 30,
              "default": 10
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "description": "上位件数。1回だけ指定でき、重複指定は拒否。",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 30
            }
          }
        ],
        "responses": {
          "200": {
            "description": "診断結果。",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "color",
                    "instanceId",
                    "startedAt",
                    "seconds",
                    "totalSamples",
                    "self",
                    "cumulative"
                  ],
                  "properties": {
                    "color": {
                      "type": "string",
                      "enum": [
                        "blue",
                        "green",
                        "unknown"
                      ]
                    },
                    "instanceId": {
                      "type": "string"
                    },
                    "startedAt": {
                      "type": "string",
                      "format": "date-time"
                    },
                    "seconds": {
                      "type": "integer",
                      "minimum": 1,
                      "maximum": 30,
                      "description": "取得時間（秒）。"
                    },
                    "totalSamples": {
                      "type": "integer",
                      "description": "CPUサンプル数。"
                    },
                    "self": {
                      "type": "array",
                      "maxItems": 100,
                      "items": {
                        "type": "object",
                        "required": [
                          "function"
                        ],
                        "properties": {
                          "function": {
                            "type": "string"
                          },
                          "file": {
                            "type": "string",
                            "description": "取得できた場合のソースファイルと行番号。"
                          },
                          "selfNanoseconds": {
                            "type": "integer",
                            "description": "自身のCPU時間（ナノ秒）。0なら省略。"
                          },
                          "cumulativeNanoseconds": {
                            "type": "integer",
                            "description": "累積CPU時間（ナノ秒）。0なら省略。"
                          },
                          "count": {
                            "type": "integer",
                            "description": "省略可能。CPUでは現行処理は設定しない。"
                          }
                        }
                      },
                      "description": "該当なしは空配列。"
                    },
                    "cumulative": {
                      "type": "array",
                      "maxItems": 100,
                      "items": {
                        "type": "object",
                        "required": [
                          "function"
                        ],
                        "properties": {
                          "function": {
                            "type": "string"
                          },
                          "file": {
                            "type": "string",
                            "description": "取得できた場合のソースファイルと行番号。"
                          },
                          "selfNanoseconds": {
                            "type": "integer",
                            "description": "自身のCPU時間（ナノ秒）。0なら省略。"
                          },
                          "cumulativeNanoseconds": {
                            "type": "integer",
                            "description": "累積CPU時間（ナノ秒）。0なら省略。"
                          },
                          "count": {
                            "type": "integer",
                            "description": "省略可能。CPUでは現行処理は設定しない。"
                          }
                        }
                      },
                      "description": "該当なしは空配列。"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "秒数または上位件数の値・指定回数が不正。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "未認証または資格情報が無効。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "画面セッション、または運用代行を許可していないPCトークンなどは拒否。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "405": {
            "description": "認可後、GET以外は拒否。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "CPUプロファイル取得中、または取得開始に失敗。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "CPUプロファイルの解析に失敗。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
