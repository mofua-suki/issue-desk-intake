                              'schema':
                                {"type":"array","items":{"type":"object","description":"種類や保存時期により項目は異なる。外部入力・旧記録由来の値は追加の項目を許容する。","properties":{"kind":{"type":["string","null"]},"title":{"type":["string","null"]},"project":{"type":["string","null"]}},"additionalProperties":true}},
                            },
                        },
