              'description': 'When a timing stage fails, error responses carry Server-Timing for stages reached, including the failed stage; failures before timing begins may have no timing metrics. Per-kind rows; no fixed full types. Rows include monitoring records, not only user decisions. job_recovery preserves optional requiresUser (true=user decision, false=monitoring, absent=legacy unknown), recoveryState and causeKey. handoff=true records a failed reply/repair validation or changed decision premise separately from the original Judge requiresUser; these notify records are cause-level handoffs even when requiresUser=false. Rejected/unknown sends or abandoned recovery are cause-level handoffs; unknown kinds remain monitoring records. Classification never authorizes an operation. dependency_stall: one row per predecessor with state, desk, title and waiting successors in reason; unknown start is explicitly marked, otherwise startedAt is the earliest qualifying wait. acceptance_transfer/state=dependency_waiting: key/project/number/title/kindName/stateLabel/reason/startedAt/updatedAt. reason lists artifacts/source/destination-or-unfiled-proposal/consultation and normal resolution; startedAt is the first artifact wait time, updatedAt is the job state update time (not necessarily the wait time). Count these rows and use startedAt for wait duration. GET only reads; screen or operations-token consultation chat/submit resolves evidence/filing, required PR merges release dispatch; retry/resume alone never releases. issue-desk-worker/docs/request-dependencies.md#transferred-acceptance-artifacts. consultation_stop/state=stopped: explicit stops remaining stalled for at least 24h; key/project/draftId/title/stateLabel/startedAt/updatedAt/reason/elapsedMinutes, handoff=true and requiresUser=false. reason includes stop reason, actor, timestamp and elapsed time. Missing/invalid stop timestamps never escalate; reply/resume/finish/discard hides the row. No automatic resume; timeout stalls do not escalate. consultation_budget/state=waiting: key/project/draftId/title/stateLabel/startedAt/updatedAt/reason; reason=ID/calls/amount/limits/last questions-reply/continuation needed. issue-desk-worker/docs/intake-input-budget.md#stopping-at-the-budget. heavy_rework: issue-desk-worker/docs/intake-api.md#attention-automation-get-apiattentionalerts. incident: issue-desk-worker/docs/incident-deadline.md#states-and-operations. unfiled_proposal: configured repo, unfinished proposal except notified/discarded or scan_excluded/rejected rejection, posted >1h/<=7d. Dedupe repo/source/proposal ID, or comment ID for malformed records without proposal ID: oldest posting/latest check; ineligible clears; proposalStatus=latest state, checkedAt=latest check/null; no body. Details: docs/followup-proposals.md#recording-exclusions-and-attention-items. split_scope_held: parentSplit draft with splitScopeHeld=true; release hides. draftId opens consultation, detail advises normal proposal; startedAt=updatedAt or createdAt, updatedAt=draft update, count=1. ops_watch/stageWatch=true (monitorObservation/successObservation/lastSuccessAt): issue-desk-worker/docs/incident-deadline.md#stage-watch-operation-records.',
              'x-issue-desk-delegate': true,
              'security': [{ 'screenSession': [] }, { 'cliKey': [] }, { 'pcToken': [] }],
              'parameters': [{"name": "project", "in": "query", "required": false, "description": "Include exact project values; repeat for OR.", "schema": {"type": "array", "items": {"type": "string", "minLength": 1}}, "style": "form", "explode": true}, {"name": "kind", "in": "query", "required": false, "description": "Include exact API row kind values (= CLI items[].caseKind, not items[].kind); repeat for OR.", "schema": {"type": "array", "items": {"type": "string", "minLength": 1}}, "style": "form", "explode": true}, {"name": "excludeProject", "in": "query", "required": false, "description": "Exclude exact project values; repeat for OR.", "schema": {"type": "array", "items": {"type": "string", "minLength": 1}}, "style": "form", "explode": true}, {"name": "excludeKind", "in": "query", "required": false, "description": "Exclude exact API row kind values (= CLI items[].caseKind, not items[].kind); repeat for OR.", "schema": {"type": "array", "items": {"type": "string", "minLength": 1}}, "style": "form", "explode": true}],
