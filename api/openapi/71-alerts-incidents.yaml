                      'headers': { 'Server-Timing': { 'description': 'Durations in milliseconds: drafts (draft alerts), saved (saved attention cases), notices (notices), stage (stage notices), incidents (incident alerts), jobs (job attention), jobRecovery (current job-recovery decisions), checkout (checkout alerts), rework (heavy rework), rc (release-candidate alerts), visible (archive visibility filtering). Filtering query parameters is performed after visible and is not included in these stages.', 'schema': { 'type': 'string' } } },
                      'content':
