                                                'approval':
                                                  {
                                                    'type': 'string',
                                                    'description': 'pr_create: 事前承認。PR番号が決まる前の利用者の承認発言の原文（500文字以内。記号の回答は見せた質問文と回答をまとめた文）。運用代行を許したトークンから送ったときだけ受付がapprovalDelegated: trueを付けて保存し、merge_manualのapprovalRequestから使う。',
                                                  },
                                                'instructionAt':
                                                  {
                                                    'type': 'string',
                                                    'description': 'pr_create: approvalがあるとき必須。利用者がチャットで指示した日時（UTCオフセット付きISO 8601（秒まで。例 2026-11-11T11:58:00+09:00）、未来でなく7日以内）。approvalの無い指定は400。',
                                                  },
                                              },
                                            'additionalProperties': false,
                                            'required': ['title', 'body', 'patch', 'base', 'patchSha256'],
