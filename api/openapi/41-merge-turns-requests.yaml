                                                    'type': 'string',
                                                    'pattern': '^[0-9]+-[a-f0-9]{8}$',
                                                    'description': 'merge_manual: 事前承認を付けた作成依頼（pr_create）のID。approvalと同時の指定は400。受付は、その依頼が同じrepo・同じ送り手のpr_createで、status=done・result.status=created・result.number/headがこの依頼のnumber/headと同じで、運用代行トークンの承認（approval・instructionAt・approvalDelegated）を持つことを確かめ、合えばapproval・instructionAt・approvalDelegated: trueを写して保存する。合わなければ400。',
                                                  },
                                              },
