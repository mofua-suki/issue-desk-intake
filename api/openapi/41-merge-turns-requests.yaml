                                                'approval':
                                                  {
                                                    'type': 'string',
                                                    'description': 'merge_manual: 利用者の承認発言の原文（500文字以内。記号の回答は見せた質問文と回答をまとめた文）。',
                                                  },
                                                'instructionAt':
                                                  {
                                                    'type': 'string',
                                                    'description': 'merge_manual: approvalがあるとき必須。利用者がチャットで指示した日時（UTCオフセット付きISO 8601（秒まで。例 2026-11-11T11:58:00+09:00）、未来でなく7日以内）。approvalの無い指定は400。',
                                                  },
                                                'approvalRequest':
