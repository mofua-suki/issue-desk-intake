            {
              'operationId': 'post_api_v1_jobs_id_state',
              'summary': 'ジョブのstateを報告',
              'x-idempotency': '終了状態の同じ報告は、同じhost・epoch・内容なら前の結果を返し、副作用を繰り返さない。acceptanceTransfersは報告と同一トランザクションで保存し、既存の移管報告との内容不一致は409(code=acceptance_transfer_conflict)。',
              'description': 'hostは送り手と同じ。leaseのepoch不一致は409(code=lease_lost)。idは1〜16桁の正整数。status/kindと各値の検査は server/internal/jobs。continuationは受付管理情報でありWorkerのview申告を採用しない。headSha付きでartifact欄が存在しない旧行は、初回epoch=1から現在epochまで欠落・重複・逆転のないleased履歴のhostが全て現在の有効なleaseのhostと一致するときだけ、headSha・branchの変更を受理して報告元owner・現世代のartifactと原子的に保存する。最後のleaseやcontinuation.hostだけでは補完しない。通常retry・retest・適格なautoRetestを経ても不正artifactの存在を保持し、旧形式として補完しない。不正なartifact・履歴不足・別hostの未公開成果置換は409(code=artifact_unavailable)で保存せず、別host・古いepoch・期限切れleaseは409(code=lease_lost)。公開証拠による引継ぎと明示的な初期状態からの再試行は従来どおり。resultはJSONで32768文字以下（超過は400、保存なし）。固定テストのコントローラー報告はさらにJSON UTF-8で32768 bytes以下に制限する。固定テストのresult.fixedTestEvidence（version=1）は抜粋前の秘匿化出力と実行状態から作る。namesは最大200件・各1000文字、証拠全体はJSON UTF-8で16000 bytes以下。total不明はnull、欠落・中断・環境異常・上限超過はcomplete=false。timeoutは実行時の時間切れだけを表し、他の失敗があるとcomplete=false。新形式はerrorやdetailから補完しない。実装結果とテスト記録が報告枠に収まらない場合はimplementationResultMissing=trueとし、testFailuresとtestTimeoutのcompleteをfalseにする。',
              'x-issue-desk-delegate': false,
              'security': [{ 'pcToken': [] }],
              'responses':
                {
                  '200':
                    {
                      'description': '受付の応答。',
                      'content':
                        {
                          'application/json':
                            {
                              'schema': { 'type': 'object', 'properties': { 'job': {} }, 'additionalProperties': true },
                            },
                        },
                    },
                  '400': { '$ref': '#/components/responses/Error400' },
                  '401': { '$ref': '#/components/responses/Error401' },
                  '403': { '$ref': '#/components/responses/Error403' },
                  '404': { '$ref': '#/components/responses/Error404' },
                  '405': { '$ref': '#/components/responses/Error405' },
                  '409': { '$ref': '#/components/responses/Error409' },
                  '502': { '$ref': '#/components/responses/Error502' },
                  '503': { '$ref': '#/components/responses/Error503' },
                },
              'parameters': [{ 'name': 'id', 'in': 'path', 'required': true, 'schema': { 'type': 'string' } }],
              'requestBody':
                {
                  'required': true,
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'properties':
                                {
                                  'host': { 'type': 'string' },
                                  'epoch': { 'type': 'integer' },
                                  'status':
                                    {
                                      'type': 'string',
                                      'enum': ['queued', 'running', 'held', 'failed', 'stopped', 'merged', 'closed'],
                                    },
                                  'controllerTest': {'type':'object','description':'実装モデルの結果とは分離した固定検証のイベント。planSHAと実測したtest（causeObservation・diagnostic）を送り、leaseの送信元・世代・対象SHAを照合する。完全な固定検証の合格だけを同じ証拠型の条件へ使う。','required':['planSHA','test'],'properties':{'planSHA':{'type':'string'},'test':{'type':'object'}}},
                                  'controllerReport': {'type':'object','description':'投稿済みの訂正報告だけの証拠。受付は対象Issue・本文指紋と、job ID・世代・head・planSHAを含む目印を照合し、同世代で現epochより前に貸出された担当者または現担当の投稿を受理する。世代を含まない旧目印は現担当の投稿のみ受理する。','required':['planSHA','head','marker','bodySHA'],'properties':{'planSHA':{'type':'string'},'head':{'type':'string'},'marker':{'type':'string'},'bodySHA':{'type':'string'}}},
                                  'holdReason': { 'type': 'string' },
                                  'branch': { 'type': 'string' },
                                  'pr': { 'type': 'integer' },
                                  'headSha': { 'type': 'string' },
                                  'diffFingerprint': {"type": ["string", "null"], "pattern": "^sha256:[0-9a-f]{64}$", "description": "baseとheadの一意なmerge-baseからheadまでの三点差分を表すsha256。merge-baseが無いか複数ある場合は報告しない。headがbaseの取り込みだけのマージである間は、その第1親をheadに読み替えることを繰り返し、読み替えた後のheadで差分を求める。取り込みだけのマージとは、親が2つで、第2親がbaseの祖先、第1親がbaseの祖先でなく、treeが両親を競合なく自動マージした結果（git merge-tree --write-tree 第1親 第2親）と一致するコミットをいう。手で編集したマージ、競合を解いたマージ、base以外の枝のマージは読み替えない。これにより、baseが同じファイルを変えていても、取り込みだけなら指紋は変わらない。両treeを再帰走査し、パス・モード・内容が異なるファイル、シンボリックリンク、サブモジュールを列挙する（renameは削除と追加）。パスの生バイトの符号なし辞書順に並べ、各行を長さ8バイトの符号なしbig endianのパス長、パスの生バイト、変更前モード6桁ASCII、変更後モード6桁ASCII、変更前の内容長8バイトbig endianと内容、変更後の内容長8バイトbig endianと内容の順で連結する。欠落側はモード000000と長さ0。通常ファイルとリンクの内容は変換しないblobの全バイト、サブモジュールはcommit object IDの小文字16進ASCIIとする。モードはGit treeの6桁表現。区切りや末尾改行は加えず、連結バイト列をSHA-256してsha256:と小文字16進64桁で表す。空差分は長さ0でsha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855。固定例: a.txtをモード100644・内容x\\n（78 0a）で新規追加した場合、入力hexは0000000000000005612e74787430303030303031303036343400000000000000000000000000000002780a、結果はsha256:85b96e7304348fab90523950169bc034c4a66fa8e30896f65c093b1b1daab191。同じ報告のheadShaが必須。nullは消去、欠落は対象が同じ場合だけ保持する。読出し時も保存されたjobId・generation・branch・pr・headShaを現在のジョブと照合し、不一致または項目欠落なら指紋をnullとして返す。承認の引継ぎ判定では、判定時点のジョブと保存された対象を必ず照合する。"},
                                  'view':
                                    {
                                      'type': 'object',
                                      'description': 'client入力の各JSON項目は32768文字以下。レビュー保留の累計はreviewHolds、保持済み下限はreviewHoldsLowerBoundで報告する。累計は非負の安全な整数（0〜9007199254740991）またはnull。明示0は累計0回の報告で、nullはunknown（完全性が不明）を表す。view全体またはreviewHoldsの欠落、負数・小数・文字列・安全整数の範囲外などの不正値も、累計を0に補完せず完全性をunknownにする。これらの累計の欠落・不正値だけでは状態報告を拒否しない。受付は保存済み累計・下限と報告された有効な累計・下限の最大値を下限として保存し、減らさない。下限が0でも確定した累計0回とは限らず、unknownになった完全性は後続の有効な報告（明示0を含む）で復元しない。取得時のjob.reviewHoldsは完全性がunknownならnull、それ以外は保持済み下限を返す。splitIndexは受付管理の分割案番号でWorkerのstate viewから除外する。dependencyReviewsは受付管理の読取専用項目でWorkerのstate viewから除外する。正規形式はview.dependencyReviews[先行のキー]のrelation（unrelated/required）、空でなく4000 UTF-16単位以内のevidence、consultationId、at（日時）。記録の検証と作成は受付側の後続作業が担い、この保護だけでは既存記録の来歴や有効性を証明しない。acceptanceTransferRecordsは受付が保存・再照合する読取専用項目でclientのviewからは除外し、受付が付加する照合情報はclient入力枠の外に保存する。acceptanceTransferInput・acceptanceTransferChecks・acceptanceTransferWaitも受付の読取専用項目でclient報告から除外する。Inputは起票時の本文スナップショットとcomplete（全文かどうか）、Checksは本文・追加指示（view.instructionsの参照contextを含む）と移管項目の指紋をキーにしたrelation（required/unrelated）・evidence・consultationId、Waitはblocking・checks・waits・targets・targetChecks（依存先ごとの判断指紋）・targetPaths（依存先ごとの再移管経路の判断指紋列）・ownedChecks（経路が一時的に探索対象外でも所有根拠を照合できる判断記録）・ownedPaths（自動依存を所有する経路。各経路の上流が明示的に無関係になれば子孫も撤回し、別の有効な経路は保持）・ownedTargets（受付が追加した依存と根拠。明示的な無関係の再判定だけで撤回し、通常の依存は保持）・missingSince（requiredかつmissingの案IDごとの初回検出ISO時刻）・orphanedWaits（1時間の猶予後に待ちから外した案のproposalId・source・criterion・artifacts・reason・missingSince）とsince（待機開始ISO時刻、待機していなければnull）。移管先の成果物はstatus=mergedに加えresult.mergeCommitの40桁SHAで実マージを確認する。空差分完了や調査報告だけでは解放しない。これらは受付が開始前の追加成果物条件と依存待ち表示に使い、再試行・再開だけでは未完成を解放しない。acceptanceTransferRecordsのversion=1、source、既知のprovider、report、proposalsを保持。proposalsはnumber/id/legacyId/status/reason/evidenceと既知のproposalId/issueを持つ。statusはmissing/unfiled/unknown/rejected/discarded/conflict/filed。通知結果不明でも既知のissueを保持する。現在の採用記録を履歴より優先し、履歴だけの拒否・破棄は内容指紋を照合する。再照合はジョブごとのトランザクションで行い、1件の失敗で他の更新を巻き戻さない。',
                                      'properties':
                                        {
                                          'reviewHolds':
                                            {
                                              'type': ['integer', 'null'],
                                              'minimum': 0,
                                              'maximum': 9007199254740991,
                                              'description': 'レビュー保留の累計。非負の安全な整数またはnull。明示0は累計0回、null・欠落・不正値はunknown（完全性が不明）。保存済み下限は減らさず、不明期間の完全性は後続報告で復元しない。起動時と未着手返却も報告する。',
                                            },
