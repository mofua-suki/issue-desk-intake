              'description': '調査専用Issueと自動監視由来の新規起票は禁止。保存済みの該当相談も再開・確定を拒否し、読取時はfilingRefusalに理由を返す。履歴は削除しない。不正なdespitePendingは永続受領前に400で拒否し、受領記録・下書き・AIを作らない。認証・対象権限・最低限の入力検査後、本文・送り手・指定値・再開状態を既存SQLiteへ永続保存して202を返す。保存失敗は成功にしない。外部照合と受付AIは応答後に既存の送り手/プロジェクト単位の直列化で開始する。providerはcodex/claudeを明示する。receiptIdとrequestIdは入力idと同じで、従来の応答idも予定の下書きIDを保つ。draftIdは初回発言の保存前はnull、保存後は下書きID。同じ送り手・同じID・同じ本文と指定値の再送は同じ受領。別内容へのID流用は409で外部処理を開始しない。他所有者の対応は公開しない。GET /api/drafts/{id}で受付IDを読むと、receiptStateでaccepted/processing/waiting/completed/rejected/failed/unknownを区別できる。受付済みは起票成功ではない。受領後のpending_similar_draft等はGETのerror/errorCodeに理由と既存相談への案内を保存する。この拒否では受付AIを呼ばず下書きも作らない。despitePendingによる別依頼の開始は新しい送信IDで一致するdraftと理由を指定する。候補は所有者別に見える範囲のduplicateHintsへ渡し、候補があっても一律に409で拒否せず、題名だけで停止しない。notDuplicateは照合の省略ではなく互換記録用。保存済み受領は起動時復旧で初回発言を照合して再開し、通常回答・hold確定・投稿結果不明の既存保証を保つ。',
              'x-issue-desk-delegate': false,
              'security': [{ 'screenSession': [], 'csrfToken': [] }, { 'cliKey': [] }, { 'pcToken': [] }],
              'responses':
                {
                  '202':
                    {
                      'description': '本文・送り手・指定値の永続受領済み。起票成功を意味しない。受領後の拒否や下書きへの対応は受付IDのGETで確認する。',
