                                  'priority': { 'type': 'string', 'enum': ['high', 'normal'] },
                                  'priorityReason': { 'type': 'string' },
                                  'tier':
                                    {
                                      'type': 'string',
                                      'enum': ['light', 'standard', 'heavy'],
                                      'description': '受付の相談の難易度（light: 低、standard: 中、heavy: 高）。必須。依頼元が依頼の難しさで判断して必ず付け、受付はその難易度のモデル・推論レベルで相談する。受付は難易度を自分で判定しない。無い・空なら400（code=TIER_REQUIRED、依頼元が付ける・古いcreate-issue.tsなら更新するよう案内）、3値以外も400。',
                                    },
                                  'implementationTier': { 'type': 'string', 'enum': ['light', 'standard', 'heavy'] },
                                  'hold':
                                    {
                                      'type': 'boolean',
                                      'description': '相談だけのモード。trueなら、受付AIが起票できると判断しても自動で起票せず、下書きを確定待ち（status=draft、ready=true）にとどめる。確定はPOST /api/drafts/{id}/submit。falseか省略は従来どおり、true・false以外は400。同じidの再送でholdが違えば使用済みとして409。',
                                    },
                                  'notDuplicate': { 'type': 'string', 'minLength': 1, 'maxLength': 500 },
                                  'despitePending':
                                    {
                                      'type': 'object',
                                      'description': '同じ送り手の似た処理中下書きによる受領後拒否を承知して別依頼を始めるときだけ指定する。draftは受付IDのGETでerrorCode=pending_similar_draftとともに案内された一致下書きID、reasonは前後の空白を除いて1〜500文字。不正な指定は受領前に400。IDが一致しなければ受領後拒否のまま。新しい送信IDで指定して通過後、新しい下書きにdraft・trim済みreason・サーバー時刻atを記録する。',
                                      'properties':
                                        {
                                          'draft': { 'type': 'string', 'minLength': 1 },
                                          'reason': { 'type': 'string', 'minLength': 1, 'maxLength': 500 },
                                        },
                                      'required': ['draft', 'reason'],
                                    },
                                },
                              'additionalProperties': true,
                              'required': ['id', 'project', 'text', 'tier'],
                            },
                        },
                    },
                },
            },
          'get':
            {
              'operationId': 'get_api_issues',
              'summary': 'Issue一覧',
              'description': 'server/internal/issueapi/read.go の row が作る行。画面のみ後続案を確認、トークン/一時キーは読取。保留・失敗・停止ジョブは未了承認をpendingFinalApprovals（id・headSha・scope・reason・fingerprint・target・operation・condition）、計画の読取不能をfinalApprovalsUnavailableとして返す。具体的な質問、実装回数・使用量の上限判断、削除・権限ファイルの承認待ちと現在のレビューのuserJudgmentsはrequiresUser=trueを返す。質問の記録が欠けた保留は未確認と表示し、自動操作を拒否する。判断根拠や自動再開条件のない保留は停止中に分類する。詳細のsummary表示でも保持する。これらは表示用であり操作の認可には使わない。配列では欠けた行を示せないため、候補のリポジトリを1つでも読めなければ一覧全体を503にし、理由に読めなかったリポジトリを書く（読めた候補だけの一覧はGET /api/issues/searchのunreadProjects・incompleteで取る）。scope=activeは画面の対応中の範囲（GET /api/list?tabs=activeと同じ絞り込み）のIssueだけを返す。開いたIssueはすべて残す。閉じたIssueは、表示状態がrunning・publishing・scope_waiting・releasing・deployingのもの、継続待ちのもの、受入条件の確認が未了のもの、同じ範囲に残る相談（引き継ぎと分割の子を除く）が起票結果・調査Issueとして記録したものとその相談から起票したもの、処理中のクローズ依頼の対象だけを残す。残した行の内容は全件と同じ。省略時は全件を返し、active以外の値は400。scope=activeでも候補のリポジトリを1つでも読めなければ503。',
