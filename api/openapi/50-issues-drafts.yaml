      '/api/issue':
        {
          'get':
            {
              'operationId': 'get_api_issue',
              'summary': 'Issue詳細',
              'description': 'verifyMerge=trueは閉じた依頼の対象PRまたは記録済み直接PRの実マージを確認し、一致時だけmergeEvidence（repo・pr・mergeCommitSha）を通常詳細へ添える。通常詳細のdependencyWaitsは未解決の依存辺ごとのproject・number・startedAt・unknownを返す。開始時刻が不明な辺はstartedAtがnull、unknownがtrue。待ち辺がなければ空配列。summaryと一覧・検索には含めない。通常詳細とsummaryには受付管理のfinalApprovalTransfers（id・fromHead・toHead・diffFingerprint・at）を表示用に返す。履歴がない場合は空配列または省略し、操作の認可には使わない。画面セッションと運用代行を許したPC別トークンの詳細には未了の最終承認pendingFinalApprovals（id・headSha・scope・reason・fingerprint・target・operation・condition）を返す。不正な計画はfinalApprovalsUnavailableを返す。保留・失敗・停止ジョブでは一覧・summaryも未了承認のID・SHA・理由・指紋を保持する。deskまたはproject+number。併記は400。閉じたIssueでジョブがmergedでない場合、ジョブのPRをGiteaで読み、取得できたmerged真偽をpr.mergedに付ける。PRが読めない場合は付けず、openまたはmergedのジョブでは追加取得しない。詳細のcloseReason.routeは直接PRの{repo, pr}（省略可能）。view=summaryは画面向けの軽量応答（server/internal/issueapi/summary.go）で、すべての認証方式に適用し、全文・全会話・実行履歴・表示に使わない技術情報を載せず、現在の質問(latestAsk)・状況・操作(actions)・識別子(project, number, desk, intakeId, closedAt)・URLは残す。省略時は従来の詳細。詳細のworkerExecutionはjobのviewの値を未知のキーも含めそのまま返し、値がない場合は項目を省略する。詳細のresultには保存済みのleaseExpiredCount・lastHost・lastStageとlastExecutionError（kind・at・stage・reasonと、有効なintakeHttpStatus・intakeCode・giteaHttpStatus）を含め、HTTP状態は100〜599の3桁の数字の文字列のみ、intakeCodeはrequest_failed・turn_lost・contract_mismatchのみを返し、その他の値や文字列以外は省略する。intakeHttpStatusとintakeCodeはkindがapi_rejectedのときだけ返す。intakeCodeはWorkerで未知のコードからrequest_failedに置換された場合があり、元のコードを復元できるとは限らない。既存の文字列は秘匿処理と長さ制限を行う。通常詳細とsummaryのdispatchRecord.eventsにはlease_expiredのat・generation・toと、受付が断った報告report_rejectedのat・host・code・status（HTTP状態）・reportKind・count・lastAt・message（伏せ字のうえ300文字まで）も含め、種類を合わせて最大20件を新しい順に返す。report_rejectedは断りの種類ごとに1件で、同じ種類の再発は回数と時刻を更新する。report_rejectedは20件の上限に数えずに必ず含め、更新後のatの位置に並べる。lastExecutionErrorは許可された項目が一つもなければ省略する。これらの診断項目とlease_expired・report_rejectedは一覧行には追加しない。summary以外のview値は400。PC別トークンのsummaryにはactionsを含めない。shownBodyがbodyと同一ならshownBodyを省略し、利用側はbodyを使う。',
