              'summary': '自分のheartbeatを送る',
              'description': 'hostは送り手と同じ。全項目省略可。busy/readyの既定false、他はnull。loadはcpuPercent/freeMemoryMB/freeDiskMB/gpuPercent/usedVramMB/freeVramMB/loadAverage1mの0以上の有限数と、logicalCpuCountの1以上の安全な整数。欠測は項目省略、全欠測はnull。旧6項目のみ・load省略・nullも受け付ける。不正値・未知キーは400で保存しない。MBは1024²バイト。capabilities 4096文字、checks 16384文字のJSON。capabilities.workerTokenKindは実際に読み込んだアカウントのdedicated判定によるworker/legacy。分類不明の旧版は省略し、トークン値・パス・ログイン名は追加送信しない。cliVersionsは{cli,current,expected,at}配列。',
