              'summary': '画面の依頼一覧（全体・差分）',
              'description': '画面のCookieセッションとNASのローカル一時キーで読める（未認証は401）。view=countsは運用代行を許したPC別トークンでも読め、それ以外の一覧取得ではPC別トークンは403。view=countsは画面の要対応・実行中・待機中・停止中の表示行数をcounts.attention・counts.running・counts.waiting・counts.stoppedに返す。counts.followupsは未完了の後続相談・Issue・クローズ確認の表示行数。相談・確認自身が終了したら履歴へ移して数えず、対象Issueが終了していても未処理の確認は残す。Issueのstatus=completedでも受入確認の未了・読取不能が残れば数え、status=closedは履歴へ移す。着手が遅れた割り込みIssueは4分類へ入るため数えない。checkedAtは取得時刻、scopeはactive。partial=trueは補助入力の欠測による暫定値で、unavailableに不足経路を返す（件数と無関係なhostsは含めない）。基礎一覧の取得失敗はエラーであり0件にしない。要対応は利用者の具体的な質問・承認待ち、実行中は実行元の処理所有を確認した仕事、待機中は条件と自動再開経路のある仕事、停止中は自動再開の予定がないか実行の根拠を確認できない仕事。優先順は要対応・停止中・実行中・待機中。保存済みの親子リンクから実在する子を持つ親相談を判定し、状態によらず一覧の表示と件数から除外して独立した子作業を数える。子がまだ作られていない分割案は独立した相談として保持する。親子判定用の軽量行はparentSplit・parentConsultationと、保存済み子リンクの存在を示すhasChildrenを返す。同じ仕事の補助通知はその仕事に紐付ける。view=workはcountsに加えて4分類のgroupsと親相談のfamiliesを返す。workは画面のCookieセッションとNASローカル一時キーで読め、PCトークンでは403。view=workのgroups内の各行のworkはstate・reason・nextActor・nextAction、待機中ではwaitCondition・resumeByを返す。executionActive・executionScheduledは実行元の読取時点の根拠で、操作の認可には使わない。view=countsまたはworkではTODO・カーソル保持・一覧本文の返却を省き、sinceは併用不可。一覧用の軽量データだけを返し、本文・会話・資料・収集画像の中身・資格情報は含めない。sinceが無ければ全体（full=true。rowsはIssue・相談・TODO・クローズ依頼の行、auxは要対応4種類、hostsはPC負荷、cursorは次の差分の基準点）。sinceにカーソルを渡すと、基準点からのadded・updated・removedと、変わった要対応（aux）・PC負荷（hosts）だけを返す。変更が無ければadded・updated・removedは空でauxは{}、hostsは含めない。取得時刻（hostsのcheckedAt）だけでは変更としない。許可されないプロジェクトの保存済みの相談・TODO・クローズ依頼は全体・差分の応答にも基準点にも含めない（プロジェクト未定の相談は含める）。基準点はプロセス内だけに有効期間5分・最大64件・軽量データの累計16MiB（UTF-8のバイト数）で保持し、期限切れ・未知・再起動前・表現や許可範囲が異なるカーソルはreset=trueの全体応答に戻す。保持できないときはcursor=nullの全体応答で、画面は次もsinceなしで取る。unavailableは今回読めなかった補助データの名前で、空や削除として扱わず表示済みの内容を残す。unreadProjectsは今回読めなかった候補のリポジトリ（読めた候補の行は返す）。そのリポジトリのIssue行は差分でremovedにせず基準点に前回の内容のまま残し、全体応答のrowsには含めない（画面は表示済みの行を読取失敗の目印付きで残し、読めるようになったら全体照合する）。view=counts・workではpartial=trueとunreadProjectsを返し、件数に読めなかったリポジトリの行を含まない。tabs=activeではTODOを読まず、他の行と補助情報を返す。tabs省略は全範囲。範囲の異なるカーソルはreset=trueの全体応答に戻す。sinceの形式不正、tabsのactive以外の値、重複指定、未知のクエリは400。',
