                                        {
                                          'type': ['integer', 'null'],
                                          'minimum': 0,
                                          'description': '期間内の読めなかった行数。取得できなければnull。',
                                        },
                                      'summaries':
                                        {
                                          'type': 'array',
                                          'minItems': 3,
                                          'maxItems': 3,
                                          'items':
                                            {
                                              'type': 'object',
                                              'additionalProperties': false,
                                              'required': ['kind', 'text'],
                                              'properties':
                                                {
                                                  'kind': { 'enum': ['usage', 'detail', 'coverage'] },
                                                  'text':
                                                    {
                                                      'type': 'string',
                                                      'description': 'usageはUTF-8で3000 bytes以内、detailは2000 bytes以内、coverageは1500 bytes以内（到着棚卸し・対象期間・観測範囲・省略件数・取得失敗理由。呼び出し母数と送信位置は不明）。文字境界と省略表示を保つ。',
                                                    },
                                                },
                                            },
                                        },
                                    },
                                },
