{
  'paths':
    {
      '/api/openapi.json': {"get": {"operationId": "get_api_openapi_json", "summary": "結合版API仕様を取得する", "description": "pathPrefix は経路の前方一致。指定時は一致する paths と参照用 components を含む仕様を返す。未知の引数、空値、重複、不正な指定は400。tailnet内でのみ利用する。", "security": [{"pcToken": []}, {"cliKey": []}, {"screenSession": []}], "parameters": [{"name": "pathPrefix", "in": "query", "required": false, "description": "/ で始まる経路の前方一致", "schema": {"type": "string", "minLength": 1, "pattern": "^/"}}], "responses": {"200": {"description": "OpenAPI仕様", "content": {"application/json": {"schema": {"type": "object"}}}}, "400": {"$ref": "#/components/responses/Error400"}, "401": {"$ref": "#/components/responses/Error401"}, "403": {"$ref": "#/components/responses/Error403"}}}},
      '/api/v1/stop-check-fires':
        {
          'post':
            {
              'operationId': 'post_api_v1_stop_check_fires',
              'summary': 'Stop検査の発動記録を送る',
              'description': 'PC別トークンは運用代行不要。一時キーも利用可。PC名は認証主体から取得し、英数字・ドット・アンダースコア・ハイフンの1〜100文字以外はotherとして保存する。本文・理由・パスは受け取らない。同じ記録IDの再送は重複しない。1000件・1MiBまで受け付け、上限超過、不正な記録、重複キーは400で拒否し保存しない。400は恒久的な入力エラーなので送信側は同じ控えを自動再送せず、原因を確認する。 全件成功か全件拒否で、200は重複IDを含む全行の受領を表す。部分成功や件数の返却は行わない。空配列も200とする。本文上限は1048576 bytes、超過時は400。',
              'x-issue-desk-delegate': false,
              'security': [{ 'pcToken': [] }, { 'cliKey': [] }],
              'requestBody':
                {
                  'required': true,
                  'content': { 'application/json': { 'schema':
                    {
                      'type': 'array',
                      'minItems': 0,
                      'maxItems': 1000,
                      'items':
                        {
                          'type': 'object',
                          'required': ['id', 'checkId', 'result', 'at', 'project'],
                          'properties':
                            {
                              'id': { 'type': 'string', 'format': 'uuid' },
                              'checkId': { 'type': 'string', 'maxLength': 100, 'pattern': '^[a-z][a-z0-9-]{0,99}$', 'description': '台帳のcounted=trueの検査IDのみ受け付ける。' },
                              'result': { 'type': 'string', 'enum': ['block', 'warn'] },
                              'at': { 'type': 'string', 'format': 'date-time' },
                              'project': { 'type': 'string', 'description': '英数字・ドット・アンダースコア・ハイフンの1〜100文字。不正な名前はother。' },
                            },
                          'additionalProperties': false,
                        },
                    } } },
                },
              'responses':
                {
                  '200': { 'description': '受付成功。同一IDの再送も成功。', 'content': { 'application/json': { 'schema': { 'type': 'object', 'required': ['ok'], 'properties': { 'ok': { 'type': 'boolean', 'const': true } }, 'additionalProperties': false } } } },
                  '400': { '$ref': '#/components/responses/Error400', 'description': '不正な記録、重複キー、1000件超過または本文1048576 bytes超過。全件を保存しない。' },
                  '401': { '$ref': '#/components/responses/Error401' },
                  '403': { '$ref': '#/components/responses/Error403' },
                },
            },
        },
      '/api/v1/usage':
        {
          'post':
            {
              'operationId': 'post_api_v1_usage',
              'summary': '使用量・上限の行を送る',
              'description': '本文1MiB、usage+limits+fixedTests+logLinesの合計は1000行まで。超過・本文の形式違いは400で保存しない。不正な行はrejected、同じ鍵はduplicate。usage行のbillingは任意。subscriptionは契約の枠、api_creditはAPIクレジットを表す。欄なしとnullは課金経路の解釈上subscription扱い。不正なbilling値は行ごとにrejected。既存行の保存値は補完・書換えしない。logLinesのPCはPC別トークンの名前。at・lineだけを受け付け、atは年0001〜9999で実在するUTC ISO日時（小数秒は1〜3桁）、他の項目・改行・空本文・上限超過はrejected。',
              'x-issue-desk-delegate': false,
              'security': [{ 'pcToken': [] }],
              'responses':
                {
                  '200':
                    {
                      'description': '受付の応答。',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                {
                                  'type': 'object',
                                  'properties': { 'added': {}, 'duplicate': {}, 'rejected': {} },
                                  'additionalProperties': true,
                                },
                            },
                        },
                    },
                  '400': { '$ref': '#/components/responses/Error400' },
                  '401': { '$ref': '#/components/responses/Error401' },
                  '403': { '$ref': '#/components/responses/Error403' },
                  '404': { '$ref': '#/components/responses/Error404' },
                  '405': { '$ref': '#/components/responses/Error405' },
                  '502': { '$ref': '#/components/responses/Error502' },
                },
              'requestBody':
                {
                  'required': true,
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'properties':
                                {
                                  'usage':
                                    { 'type': 'array', 'items': { 'type': 'object', 'description': 'diagnosticKindとcallIdは省略可能。いずれもsource=intakeのみ指定でき、不正な値は行ごとにrejected。callIdは物理呼び出しごとのUUIDで、同一ID・同一内容はduplicate、同一ID・異なる内容はrejected。', 'properties': { 'source': { 'type': 'string' }, 'callId': { 'type': 'string', 'pattern': '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$' }, 'diagnosticKind': { 'type': 'string', 'enum': ['completed', 'timeout_idle', 'timeout_total', 'canceled_by_server', 'spawn_failed', 'output_overflow', 'exit_nonzero', 'authentication', 'rate_limit', 'usage_limit', 'format', 'session', 'input_invalid', 'execution'] } }, 'allOf': [{ 'if': { 'required': ['callId'] }, 'then': { 'required': ['source'], 'properties': { 'source': { 'const': 'intake' } } } }, { 'if': { 'required': ['diagnosticKind'] }, 'then': { 'required': ['source'], 'properties': { 'source': { 'const': 'intake' } } } }], 'additionalProperties': true } },
                                  'limits':
                                    { 'type': 'array', 'items': { 'type': 'object', 'additionalProperties': true } },
                                  'fixedTests':
                                    { 'type': 'array', 'items': { 'type': 'object', 'additionalProperties': true } },
                                  'logLines':
                                    {
                                      'type': 'array',
                                      'items':
                                        {
                                          'type': 'object',
                                          'required': ['at', 'line'],
                                          'properties':
                                            {
                                              'at':
                                                {
                                                  'type': 'string',
                                                  'format': 'date-time',
                                                  'description': 'UTCのISO日時（Z、秒以下は3桁まで）',
                                                },
                                              'line':
                                                {
                                                  'type': 'string',
                                                  'minLength': 1,
                                                  'maxLength': 16384,
                                                  'pattern': '^[^\u0000\r\n]+$',
                                                  'description': 'UTF-16コード単位で16384以内。空文字・NUL・CR・LFはrejected。',
                                                },
                                            },
                                          'additionalProperties': false,
                                        },
                                    },
                                },
                              'additionalProperties': false,
                            },
                        },
                    },
                },
            },
        },
      '/api/v1/settings':
        {
          'get':
            {
              'operationId': 'get_api_v1_settings',
              'summary': '運用設定の版と値を読む',
