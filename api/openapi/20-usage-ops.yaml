      '/api/v1/ops-watch/lease':
        {
          'post':
            {
              'operationId': 'post_api_v1_ops_watch_lease',
              'summary': '運用の見張りの予約を取得・更新する',
              'description': '予約なし・期限切れ・同じPC・primary=trueなら取得。主は待機から取り戻す。同期settingsのops-watch-leaseにholder・renewedAt・untilを保存する。',
