      '/api/v1/ops/usage-anomalies':
        {
          'get':
            {
              'operationId': 'get_api_v1_ops_usage_anomalies',
              'summary': '使用量の異常を読む',
              'description': '時差付きISO日時。省略は直近24時間、最大7日。[from,to)。保存・起票しない。anomaliesのkindはlimit-forecast（上限の枠が切れる見込み。全判定はlimitForecast。判定・閾値・保留理由は応答スキーマを参照）・repeat・outlier・failure・hourly・intake-repeat（受付の活動下書き当たりの呼び出し増加）・cache（相談のキャッシュに乗らない入力の増加）・call-trigger（受付の呼び出しのきっかけの比率の悪化）・unit-total（相談・Issue 単位の合計の外れ）・filing-check（起票1件あたりの確認回数の増加。全判定はfilingCheck。直近7日と直前7日の起票あたり確認回数を比べ、直近値>=max(1.0,直前値×2)で当たり。分母不足・欠測は理由付きでheld）・filing-cache（起票直前の確認のキャッシュの是正の効果なし。全判定はfilingCache）。unit-totalは期間末尾endで1回、draftのある行は相談、それ以外のrepo・issueのある行はIssueとして分け、期間に行がある単位の(end−7日,end]の行数・重み付き量を、同種の他単位（自分を除く）の(end−14日,end−7日]の合計の中央値と比較。比較10単位以上で、行数が5倍以上かつ30行以上、または量が5倍以上。各指標の中央値0は判定しない。不明量は行数に含め量から除きunknownに数える。両条件成立時は回数を返す。閾値は期間7日・同種の他単位10件以上・中央値の5倍以上・回数は30行以上（server/internal/anomalies/aggregate.go の UnitTotals）。step=null、at=end、rowは単位の最後の行の写し、相談はdraftを持ちcauseKey=unit-total:draft:<draft>、Issueはunit-total:<repo>#<issue>。call-triggerは期間の最後の行の時刻endで1回、source=intakeを工程×実行先別に直近24時間(end−24時間,end]と直前7日(end−8日,end−24時間]で比較。文字列callTriggerの行だけを分母とし、欠測はcurrent/previous.unknown、既知の分母はcount。initial・user_reply以外の各値を動的に比較。両窓20行以上、直近の比率が直前の1.5倍以上かつ0.1以上増加で当たり。基準0なら直近0.1以上でratio=null。threshold=max(基準×1.5,基準+0.1)、unit=比率、step・provider・callTrigger・measured・baseline・rule・periodを含み、rowは組の直近窓の最後の行の写し、causeKeyはcall-trigger:<工程>:<実行先>:<値>。閾値は server/internal/anomalies/aggregate.go の CallTriggers。provider-shift（実行先の急変）は期間の最後の行の時刻endで1回。0件の型は、直前7日(end−7日−12時間,end−12時間]に20行以上あった実行先が直近12時間(end−12時間,end]に0行で、同じ12時間にほかの実行先の行が合わせて10行以上なら当たり（measuredは最後の行からendまでの時間、unit=時間、rowはその実行先の最後の行の写し、causeKey=provider-shift:*:<実行先>）。比率の型は工程ごとに直近24時間(end−24時間,end]と直前7日(end−8日,end−24時間]の各実行先の行の比率を比べ、両窓が各20行以上で差の絶対値が0.5以上なら当たり（unit=比率、causeKey=provider-shift:<工程>:<実行先>）。実行先の無い行は分母と0件の判定から除きunknownに数える。閾値は server/internal/anomalies/aggregate.go の ProviderShifts。検出全体の入口は server/internal/anomalies/service.go の Detect。',
              'x-issue-desk-delegate': true,
              'security': [{ 'pcToken': [] }],
              'responses':
                {
                  '200':
                    {
                      'description': '受付の応答。',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                {
                                  'type': 'object',
                                  'properties':
                                    {
                                      'from': {},
                                      'to': {},
                                      'rows': {},
                                      'anomalies': {},
                                      'filingCheck':
                                        {
                                          'type': 'array',
                                          'description': '起票1件あたりの確認回数の増加（kind=filing-check）。稼働実績filingCheckと同じ保持した確認イベントの集計をconfig.repositoriesのリポジトリごとに読む。比較期間はtoを終端にした直近7日[to−7日,to)と直前7日[to−14日,to−7日)。値=確認回数(compare_requested)÷期間内の新規Issue数。直近値>=max(1.0,直前値×2)（ちょうども当たり）でhit。分母0・保持記録なし・収集開始前や30日の保持範囲外を含む期間・読取失敗は値を捏造せずheldとしreasonsに理由を返す。当たりだけanomaliesにも含む。本文・題名・プロンプトは含まない。',
                                          'items':
                                            {
                                              'type': 'object',
                                              'properties':
                                                {
                                                  'kind': { 'const': 'filing-check' },
                                                  'kindName': { 'const': '起票1件あたりの確認回数の増加' },
                                                  'repo': { 'type': 'string' },
                                                  'status': { 'enum': ['hit', 'normal', 'held'] },
                                                  'reasons':
                                                    {
                                                      'type': 'array',
