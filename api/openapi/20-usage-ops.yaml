                                  'properties':
                                    {
                                      'source': { 'const': 'usage-db' },
                                      'project': { 'type': 'string' },
                                      'from': { 'type': 'string', 'format': 'date-time' },
                                      'to': { 'type': 'string', 'format': 'date-time' },
                                      'generatedAt': { 'type': 'string', 'format': 'date-time' },
                                      'ok': { 'type': 'boolean' },
                                      'reason':
                                        {
                                          'type': ['string', 'null'],
                                          'description': '秘匿済みの欠測理由。正常時はnull。',
                                        },
