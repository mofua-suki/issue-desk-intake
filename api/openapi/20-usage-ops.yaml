      '/api/v1/client-config':
        {
          'get':
            {
              'operationId': 'get_api_v1_client_config',
              'summary': '自分のclient設定を読む',
              'description': 'host省略時は送り手。別PCは403。sinceが現在の版なら{version,unchanged:true}。違えば{version,config,configurationVersion,settings,settingsVersion,reviewNotes}。server/internal/fleet/client_config.go の ClientConfig を参照。配布する構成の全項目の型は採録していない。config.nativeTestVersionsはテスト担当IDごとの設定ダイジェストで、Mac側の検証コマンド変更も実装担当のconfigurationVersionへ反映する。config.hostRoleはimplementation/test-only。config.testRepositoriesはこのPCのネイティブテスト対象。config.assignments.hostRolesとtestRepositoriesにもホスト別の役割・対象を配る。Macテスト担当のconfig.repositories[].nativeNetwork（任意の真偽値）は隔離した検証のネットワークを有効にし、nativeToolRoots（任意の絶対パス配列）はSDKの参照先を指定する。config.repositories[].nativeTestHostがあるリポジトリはマージ前にそのホストのAppleネイティブ検証の成功が必要。config.repositories[].testTimeoutSecondsは任意で、1〜2147483の整数を指定すると、そのリポジトリの固定テスト本体の期限になる（省略時はPC単位のtestTimeoutSeconds。準備はjobTimeoutSeconds）。',
              'x-issue-desk-delegate': false,
              'security': [{ 'pcToken': [] }],
              'responses':
                {
                  '200':
                    {
                      'description': '受付の応答。',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                {
                                  'type': 'object',
                                  'properties':
                                    {
                                      'version': {},
                                      'config': {},
                                      'configurationVersion': {},
                                      'settings': {},
                                      'settingsVersion': {},
                                      'reviewNotes': {},
                                      'unchanged': {},
                                    },
                                  'additionalProperties': true,
                                },
                            },
                        },
                    },
                  '400': { '$ref': '#/components/responses/Error400' },
                  '401': { '$ref': '#/components/responses/Error401' },
                  '403': { '$ref': '#/components/responses/Error403' },
                  '404': { '$ref': '#/components/responses/Error404' },
                  '405': { '$ref': '#/components/responses/Error405' },
                  '502': { '$ref': '#/components/responses/Error502' },
                  '503': { '$ref': '#/components/responses/Error503' },
                },
              'parameters':
                [
                  { 'name': 'host', 'in': 'query', 'schema': { 'type': 'string' } },
                  { 'name': 'since', 'in': 'query', 'schema': { 'type': 'string' } },
                ],
            },
        },
      '/api/v1/usage/summary':
        {
          'get':
            {
              'operationId': 'get_api_v1_usage_summary',
              'summary': '受付DBに集まった全PC分の使用量と詳細の要約',
              'description': '今日を含む直近30日、日本時間の0時境界の[from,to)。運用の代行を許したPC別トークン専用。未送信分は含まない。正常0件はok=true、DB初期化・期間内または補正用読取失敗はok=falseでローカルへ代替しない。生の行・プロンプト・依頼文・回答本文は返さない。',
              'x-issue-desk-delegate': true,
              'security': [{ 'pcToken': [] }],
              'parameters':
                [
                  {
                    'name': 'project',
                    'in': 'query',
                    'description': '省略・空文字は全体。それ以外は登録済みリポジトリ名。',
                    'schema': { 'type': 'string' },
                  },
                ],
              'responses':
                {
                  '200':
                    {
                      'description': '取得成否と上限付き要約。DB障害も200で欠測理由を返す。',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                {
                                  'type': 'object',
                                  'additionalProperties': false,
                                  'required':
                                    [
                                      'source',
