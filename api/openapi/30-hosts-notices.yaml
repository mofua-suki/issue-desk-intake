{
  'paths':
    {
      '/api/hosts':
        {
          'get':
            {
              'operationId': 'get_api_hosts',
              'summary': 'PCの負荷・状態',
              'description': 'hostsView.currentの値。heartbeat、負荷、drain等を含む。各行のintakeHoldはhosts表の保存値そのままで、未報告・行なしはnull。各行にrevision・busy・hostdHealth(cycle)を持つ（server/internal/hosts/view.go）。欠測・不正値はnullで、busyの欠測をfalseにしない。時刻はUTCのISO文字列で、cycle.atはPCの報告時刻、cycle.receivedAtは受付の受信時刻。不正な保存周期はnull。通常のPC別トークンで読める。構成依存の全項目の型は採録していない。 実効desiredはhost別release、global releaseの順。image.desiredとglobal rolloutの進捗は独立して表示し、読取では判定を更新しない。',
              'x-issue-desk-delegate': false,
              'security': [{ 'screenSession': [] }, { 'cliKey': [] }, { 'pcToken': [] }],
              'responses':
                {
                  '200':
                    {
                      'description': '受付の応答。',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                {
                                  'type': 'object',
                                  'additionalProperties': true,
                                  'properties':
                                    {
                                      'releaseRollouts':
                                        {
                                          'description': 'flavorごとのglobal rolloutの保存済み進捗。PC別releaseの有無とは独立して表示する。判定は通常の保守処理で行い、この読取では更新しない。開始から180分以上の未完了canaryは成功条件より先にtimeoutでfailedとなる。',
                                          'type': 'array',
                                          'items':
                                            {
                                              'type': 'object',
                                              'required':
                                                [
                                                  'flavor',
                                                  'stage',
                                                  'revision',
                                                  'tag',
                                                  'canaryHost',
                                                  'successCycles',
                                                  'successNeeded',
                                                  'startedAt',
                                                  'decidedAt',
                                                  'reason',
                                                ],
                                              'properties':
                                                {
                                                  'flavor': { 'type': 'string' },
                                                  'stage': { 'enum': ['canary', 'passed', 'failed'] },
                                                  'revision': { 'type': ['string', 'null'] },
                                                  'tag': { 'type': ['string', 'null'] },
                                                  'canaryHost': { 'type': ['string', 'null'] },
                                                  'successCycles': { 'type': ['integer', 'null'] },
                                                  'successNeeded': { 'type': ['integer', 'null'] },
                                                  'startedAt': { 'type': ['string', 'null'], 'format': 'date-time' },
                                                  'decidedAt': { 'type': ['string', 'null'], 'format': 'date-time' },
                                                  'reason': { 'type': ['string', 'null'] },
                                                },
                                            },
                                        },
                                      'hosts':
                                        {
                                          'type': 'array',
                                          'items':
                                            {
                                              'type': 'object',
                                              'additionalProperties': true,
                                              'required':
                                                [
                                                  'repositories',
                                                  'repositoryLoads',
                                                  'hostLoad',
                                                  'intakeHold',
                                                  'rollout',
                                                  'loadHistory',
                                                  'overloaded',
                                                  'heartbeatMetrics',
                                                ],
                                              'properties':
                                                {
                                                  'executionPlanVersion': { 'type': ['integer', 'null'], 'description': '受入条件の実行分担を処理するWorkerの対応版。未報告はnull。' },
                                                  'executionCapabilities': { 'type': 'object', 'description': 'Workerが実測した能力。race・gcc・cgo・docker・browser・systemd・windows・networkの値は真偽値かnull。未確認はtrueにしない。', 'additionalProperties': { 'type': ['boolean', 'null'] } },
                                                  'repositories':
                                                    {
                                                      'type': ['array', 'null'],
                                                      'items': { 'type': 'string' },
                                                      'description': '担当表の実装担当リポジトリ。順位の昇順、同順位は名前の昇順。空配列は担当表にPCがあり担当なし、nullは担当表にない記録のみのPCで担当不明。旧応答で項目がない場合も不明。',
                                                    },
                                                  'hostLoad':
                                                    { 'type': ['object', 'null'], 'description': '担当外を含むPC全体の有効lease件数。集計失敗時はnull。', 'required': ['implementing', 'publishing'], 'properties': { 'implementing': { 'type': 'integer', 'minimum': 0 }, 'publishing': { 'type': 'integer', 'minimum': 0 } } },
                                                  'repositoryLoads':
                                                    {
                                                      'type': ['array', 'null'],
                                                      'description': '担当順のリポジトリ別上限と有効leaseの件数。担当なしは空配列、担当表にないPCはnull。集計読取失敗時は件数がnull。',
                                                      'items': { 'type': 'object', 'required': ['repository', 'max', 'implementing', 'publishing'], 'properties': { 'repository': { 'type': 'string' }, 'max': { 'type': 'integer' }, 'implementing': { 'type': ['integer', 'null'] }, 'publishing': { 'type': ['integer', 'null'] } } },
                                                    },
                                                  'heartbeatMetrics':
                                                    { '$ref': '#/components/schemas/HeartbeatMetrics' },
                                                  'overloaded':
                                                    {
                                                      'type': 'boolean',
                                                      'description': '新しい実装の配布を負荷で見送る判定。dispatch.loadLimitとdispatch.leaseMinutes、受付の現在時刻、個々の受信標本を配布と共通の関数で評価する。判定不能はfalse。旧APIで項目が欠ける場合は未確認。既存ジョブやlease延長は停止しない。',
                                                    },
                                                  'loadHistory':
                                                    {
                                                      'type': ['object', 'null'],
                                                      'description': '受付の受信時刻による直近3時間の閉区間。標本なし・履歴読取失敗はnull。各項目は有効な値だけの最大max・算術平均average・有効標本数count、全欠測の項目はnull。0は有効標本。現在値loadとは別で、送信停止後も読み取り時の窓から期限切れを除外する。overloadedは集計値ではなく個々の標本を使う。',
                                                      'required':
                                                        [
                                                          'cpuPercent',
                                                          'freeMemoryMB',
                                                          'freeDiskMB',
                                                          'loadAverage1m',
                                                          'logicalCpuCount',
                                                          'gpuPercent',
                                                          'usedVramMB',
                                                          'freeVramMB',
                                                        ],
                                                      'propertyNames':
                                                        {
                                                          'enum':
                                                            [
                                                              'cpuPercent',
                                                              'freeMemoryMB',
                                                              'freeDiskMB',
                                                              'loadAverage1m',
                                                              'logicalCpuCount',
                                                              'gpuPercent',
                                                              'usedVramMB',
                                                              'freeVramMB',
                                                            ],
                                                        },
                                                      'additionalProperties':
                                                        {
                                                          'type': ['object', 'null'],
                                                          'required': ['max', 'average', 'count'],
                                                          'additionalProperties': false,
                                                          'properties':
                                                            {
                                                              'max': { 'type': 'number', 'minimum': 0 },
                                                              'average': { 'type': 'number', 'minimum': 0 },
                                                              'count': { 'type': 'integer', 'minimum': 1 },
                                                            },
                                                        },
                                                    },
                                                  'rollout':
                                                    {
                                                      'description': 'global rolloutの保存済み進捗。roleはこのPCへのglobal配布に適用される場合のcanary・held・spread。host別releaseが優先する場合や現在のglobal revisionと異なる場合はnullとし、reasonにhost_overrideまたはglobal_revision_changedを付ける。releaseがなければroleはnull、reasonにrelease_missingを付ける。stage・revision・成功周期等はglobalの進捗として残し、全体はreleaseRolloutsでも確認できる。heldだけでPCの実行不能を意味しない。',
                                                      'type': 'object',
                                                      'required':
                                                        [
                                                          'role',
                                                          'stage',
                                                          'revision',
                                                          'tag',
                                                          'canaryHost',
                                                          'successCycles',
                                                          'successNeeded',
                                                          'startedAt',
                                                          'decidedAt',
                                                          'reason',
                                                        ],
                                                      'properties':
                                                        {
                                                          'role': { 'enum': ['canary', 'held', 'spread', null] },
                                                          'stage': { 'enum': ['canary', 'passed', 'failed', 'none'] },
                                                          'revision': { 'type': ['string', 'null'] },
                                                          'tag': { 'type': ['string', 'null'] },
                                                          'canaryHost': { 'type': ['string', 'null'] },
                                                          'successCycles': { 'type': ['integer', 'null'] },
                                                          'successNeeded': { 'type': ['integer', 'null'] },
                                                          'startedAt':
                                                            { 'type': ['string', 'null'], 'format': 'date-time' },
                                                          'decidedAt':
                                                            { 'type': ['string', 'null'], 'format': 'date-time' },
                                                          'reason': { 'type': ['string', 'null'] },
                                                        },
                                                    },
                                                  'image':
                                                    {
                                                      'type': 'object',
                                                      'description': '共有DBの望む版と結果（Issue #3987）。共有DBが無い・読めないときは省略し、代わりにimageUnavailableを返す。対象PCの行が無いときも省略する。',
                                                      'required': ['flavor', 'desired', 'failedTags', 'results'],
                                                      'properties':
                                                        {
                                                          'flavor': { 'type': 'string' },
                                                          'desired':
                                                            {
                                                              'description': '実効desired。flavorごとにhost別releaseを優先し、次にglobal releaseを選ぶ。sourceはhostまたはglobalで、desired-imageのdesired.hostが対象PCならhost、*ならglobalに対応する。host別releaseにはglobalの保留・失敗を適用しない。globalのcanary以外への保留中と失敗時はprevious、canary中の検証PCはcanary、それ以外はdesiredをroleに示す。reasonはprevious選択時のstageと失敗理由。表示の読取は判定を更新しない。',
                                                              'type': ['object', 'null'],
                                                              'required':
                                                                ['tag', 'revision', 'source', 'role', 'reason'],
                                                              'properties':
                                                                {
                                                                  'tag': { 'type': 'string' },
                                                                  'revision': { 'type': 'string' },
                                                                  'source': { 'enum': ['host', 'global'] },
                                                                  'role': { 'type': 'string' },
                                                                  'reason': { 'type': ['string', 'null'] },
                                                                },
                                                            },
                                                          'failedTags':
                                                            { 'type': 'array', 'items': { 'type': 'string' } },
                                                          'results':
                                                            {
                                                              'type': 'array',
                                                              'items':
                                                                {
                                                                  'type': 'object',
                                                                  'required': ['tag', 'flavor', 'status', 'at'],
                                                                  'properties':
                                                                    {
                                                                      'tag': { 'type': 'string' },
                                                                      'flavor': { 'type': 'string' },
                                                                      'status': { 'type': 'string' },
                                                                      'at':
                                                                        {
                                                                          'type': ['string', 'null'],
                                                                          'format': 'date-time',
                                                                        },
                                                                    },
                                                                },
                                                            },
                                                          'lastFailure':
                                                            {
                                                              'type': ['object', 'null'],
                                                              'description': '直近のイメージ結果（results先頭）がfailedのときの失敗理由。同じhost・tag・flavorの最新failed履歴に理由があればstage・reason・detail・selfCheckFailedを履歴から返し、理由がなければhostdの周期報告と自己検査から作る。failedでない・結果なしはnull。cycleAtは失敗周期の時刻で、該当周期が無ければnull。文字列は伏せ字にして300文字まで、自己検査は最大10件。',
                                                              'required':
                                                                [
                                                                  'tag',
                                                                  'at',
                                                                  'stage',
                                                                  'reason',
                                                                  'detail',
                                                                  'cycleAt',
                                                                  'selfCheckFailed',
                                                                ],
                                                              'properties':
                                                                {
                                                                  'tag': { 'type': 'string' },
                                                                  'at':
                                                                    {
                                                                      'type': ['string', 'null'],
                                                                      'format': 'date-time',
                                                                    },
                                                                  'stage': { 'type': ['string', 'null'] },
                                                                  'reason': { 'type': ['string', 'null'] },
                                                                  'detail': { 'type': ['string', 'null'] },
                                                                  'cycleAt':
                                                                    {
                                                                      'type': ['string', 'null'],
                                                                      'format': 'date-time',
                                                                    },
                                                                  'selfCheckFailed':
                                                                    {
                                                                      'type': 'array',
                                                                      'maxItems': 10,
                                                                      'items': { 'type': 'string' },
                                                                    },
                                                                },
                                                            },
                                                        },
                                                    },
                                                  'imageUnavailable':
                                                    {
                                                      'type': 'string',
                                                      'description': 'imageを返せない理由。「共有DBがありません」または「共有DBを読めませんでした」。',
                                                    },
                                                  'selfCheck':
                                                    {
                                                      'type': ['object', 'null'],
                                                      'description': '監視が起動時に送る自己検査の要約（Issue #3987）。ok=falseの項目だけを最大10件、detailは伏せ字にして200文字まで。checksの無い旧版のPCはnull。',
                                                      'required': ['at', 'ok', 'settingsVersion', 'failed'],
                                                      'properties':
                                                        {
                                                          'at': { 'type': ['string', 'null'] },
                                                          'ok': { 'type': 'boolean' },
                                                          'settingsVersion': { 'type': ['string', 'null'] },
                                                          'failed':
                                                            {
                                                              'type': 'array',
                                                              'maxItems': 10,
                                                              'items':
                                                                {
                                                                  'type': 'object',
                                                                  'required': ['name', 'label', 'detail'],
                                                                  'properties':
                                                                    {
                                                                      'name': { 'type': 'string' },
                                                                      'label': { 'type': 'string' },
                                                                      'detail': { 'type': 'string' },
                                                                    },
                                                                },
                                                            },
                                                        },
                                                    },
                                                  'intakeHold':
                                                    {
                                                      'type': ['object', 'null'],
                                                      'required': ['reasons'],
                                                      'properties':
                                                        {
                                                          'reasons':
                                                            {
                                                              'type': 'array',
                                                              'items':
                                                                {
                                                                  'type': 'object',
                                                                  'required': ['kind', 'since', 'detail'],
                                                                  'properties':
                                                                    {
                                                                      'kind':
                                                                        {
                                                                          'enum':
                                                                            [
                                                                              'swap_wait',
                                                                              'codex_unavailable',
                                                                              'environment_hold',
                                                                              'usage_limit',
                                                                              'color_standby',
                                                                              'scan_not_ready',
                                                                            ],
                                                                        },
                                                                      'since':
                                                                        { 'type': 'string', 'format': 'date-time' },
                                                                      'detail': { 'type': 'string' },
                                                                      'provider':
                                                                        { 'enum': ['codex', 'claude', 'antigravity'] },
                                                                      'until':
                                                                        { 'type': 'string', 'format': 'date-time' },
                                                                      'source': { 'type': 'string' },
                                                                      'limitKind':
                                                                        {
                                                                          'enum': ['five_hour', 'seven_day', 'unknown'],
                                                                        },
                                                                    },
                                                                },
                                                            },
                                                        },
                                                    },
                                                },
                                            },
                                        },
                                    },
                                },
                            },
                        },
                    },
                  '400': { '$ref': '#/components/responses/Error400' },
                  '401': { '$ref': '#/components/responses/Error401' },
                  '403': { '$ref': '#/components/responses/Error403' },
                  '404': { '$ref': '#/components/responses/Error404' },
                  '409': { '$ref': '#/components/responses/Error409' },
                  '502': { '$ref': '#/components/responses/Error502' },
                },
            },
        },
      '/api/v1/hosts/{host}/drain':
        {
          'put':
            {
              'operationId': 'put_api_v1_hosts_host_drain',
              'summary': '引き取りの停止印を置く・外す',
              'description': 'PC別トークンは運用代行の許可が必要。hostdは自分のPCだけで更新印を置く。期限内の手動の印を保持してhostdの印を重ね、イメージ更新を進める。応答のdrainはhostd自身の印、manualDrainは期限内の手動の印かnull。PCの行が無ければ409。',
              'x-issue-desk-delegate': 'pcToken',
              'security': [{ 'pcToken': [] }, { 'hostdToken': [] }],
              'responses':
                {
                  '200':
                    {
                      'description': '受付の応答。',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                {
                                  'type': 'object',
                                  'properties': { 'host': {}, 'drain': {}, 'manualDrain': {} },
                                  'additionalProperties': true,
                                },
                            },
                        },
                    },
                  '400': { '$ref': '#/components/responses/Error400' },
                  '401': { '$ref': '#/components/responses/Error401' },
                  '403': { '$ref': '#/components/responses/Error403' },
                  '404': { '$ref': '#/components/responses/Error404' },
                  '405': { '$ref': '#/components/responses/Error405' },
                  '409': { '$ref': '#/components/responses/Error409' },
                  '502': { '$ref': '#/components/responses/Error502' },
                  '503': { '$ref': '#/components/responses/Error503' },
                },
              'parameters': [{ 'name': 'host', 'in': 'path', 'required': true, 'schema': { 'type': 'string' } }],
              'requestBody':
                {
                  'required': false,
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'description': 'PC別トークンのPUTではreason必須。hostdのPUTはuntilだけを受け付ける（本文省略は旧版互換）。until省略・nullは既定150分（ISSUE_DESK_DRAIN_DEFAULT_MINUTES）、ISO日時は未来の日時。',
                              'anyOf':
                                [
                                  {
                                    'type': 'object',
                                    'properties':
                                      {
                                        'reason': { 'type': 'string', 'minLength': 1, 'maxLength': 500 },
                                        'until': { 'type': ['string', 'null'], 'format': 'date-time' },
                                      },
                                    'additionalProperties': false,
                                    'required': ['reason'],
                                  },
                                  {
                                    'type': 'object',
                                    'properties': { 'until': { 'type': ['string', 'null'], 'format': 'date-time' } },
                                    'additionalProperties': false,
                                  },
                                ],
                            },
                        },
                    },
                },
            },
          'delete':
            {
              'operationId': 'delete_api_v1_hosts_host_drain',
              'summary': '引き取りの停止印を置く・外す',
              'description': 'PC別トークンは運用代行の許可が必要。hostdは自分のPCだけで更新印を解除する。期限内の手動の印があればhostdだけを外して手動停止を残し、それ以外はnullにする。PCの行が無ければ409。',
              'x-issue-desk-delegate': 'pcToken',
              'security': [{ 'pcToken': [] }, { 'hostdToken': [] }],
              'responses':
                {
                  '200':
                    {
                      'description': '受付の応答。',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                {
                                  'type': 'object',
                                  'properties': { 'host': {}, 'drain': {} },
                                  'additionalProperties': true,
                                },
                            },
                        },
                    },
                  '400': { '$ref': '#/components/responses/Error400' },
                  '401': { '$ref': '#/components/responses/Error401' },
                  '403': { '$ref': '#/components/responses/Error403' },
                  '404': { '$ref': '#/components/responses/Error404' },
                  '405': { '$ref': '#/components/responses/Error405' },
                  '409': { '$ref': '#/components/responses/Error409' },
                  '502': { '$ref': '#/components/responses/Error502' },
                  '503': { '$ref': '#/components/responses/Error503' },
                },
              'parameters': [{ 'name': 'host', 'in': 'path', 'required': true, 'schema': { 'type': 'string' } }],
            },
        },
      '/api/v1/notices':
        {
          'post':
            {
