{
  'components':
    {
      'schemas':
        {
          'UsageToolErrorItems':
            {
              'type': 'array',
              'description': '分類ごとの回数。回数の多い順、同じなら分類名の順。',
              'items':
                {
                  'type': 'object',
                  'required': ['category', 'count'],
                  'properties':
                    {
                      'category':
                        {
                          'type': 'string',
                          'enum':
                            [
                              'sandbox_rejected',
                              'command_not_found',
                              'nonzero_exit',
                              'timeout',
                              'read_denied',
                              'other',
                              'notice',
                              'retry',
                            ],
                        },
                      'count': { 'type': 'integer', 'minimum': 1 },
                    },
                },
            },
          'UsageStepProvider':
            {
              'type': 'object',
              'description': '工程と実行先を別項目で返す。数値は既知値のみの合計、全件不明はnull。生入力はCodexだけキャッシュ読みを含む。uncachedInputTokensはClaudeの入力、Codexの入力−読み（負なら不明）。normalizedCacheWriteTokensはCodexで非該当の0、その他は既存定義。未知のproviderの正規化値は不明。weightedは既存のusageWeights（既定入力1・読み0.1・書き1.25・出力5）を行ごとに適用し、必要な内訳が不明なら不明。costUsdは既存の費用補正後。',
              'required':
                [
                  'step',
                  'provider',
                  'count',
                  'inputTokens',
                  'outputTokens',
                  'cacheReadTokens',
                  'cacheWriteTokens',
                  'costUsd',
                  'uncachedInputTokens',
                  'normalizedCacheWriteTokens',
                  'weighted',
                  'cacheWriteNotApplicable',
                  'unknown',
                ],
              'properties':
                {
                  'step': { 'type': ['string', 'null'], 'description': '工程。欠測・空文字はnull。' },
                  'provider':
                    { 'type': ['string', 'null'], 'description': '実行先。欠測・空文字はnullのグループへ含める。' },
                  'count': { 'type': 'integer', 'minimum': 1 },
                  'inputTokens': { 'type': ['number', 'null'] },
                  'outputTokens': { 'type': ['number', 'null'] },
                  'cacheReadTokens': { 'type': ['number', 'null'] },
                  'cacheWriteTokens': { 'type': ['number', 'null'] },
                  'costUsd': { 'type': ['number', 'null'] },
                  'uncachedInputTokens': { 'type': ['number', 'null'] },
                  'normalizedCacheWriteTokens': { 'type': ['number', 'null'] },
                  'weighted': { 'type': ['number', 'null'] },
                  'cacheWriteNotApplicable': { 'type': 'integer', 'minimum': 0 },
                  'unknown':
                    {
                      'type': 'object',
                      'description': '値が不明で合計から除いた行の件数（0で補わない）。Codexの生cacheWriteTokensの欠測と、公開単価で換算できないCodexのcostUsdの欠測も含む。',
                      'required':
                        [
                          'inputTokens',
                          'outputTokens',
                          'cacheReadTokens',
                          'cacheWriteTokens',
                          'costUsd',
                          'uncachedInputTokens',
                          'normalizedCacheWriteTokens',
                          'weighted',
                        ],
                      'additionalProperties': { 'type': 'integer', 'minimum': 0 },
                    },
                },
            },
          'UsageDraftMetric':
            {
              'type': 'object',
              'required': ['knownTotal', 'missing'],
              'additionalProperties': false,
              'properties':
                {
                  'knownTotal':
                    {
                      'type': 'integer',
                      'minimum': 0,
                      'description': '値が記録された行の合計。全行欠測の場合は0だが、実使用量が0とは限らない。',
                    },
                  'missing':
                    {
                      'type': 'integer',
                      'minimum': 0,
                      'description': '値が欠測している行数。既知の0は欠測に含めない。',
                    },
                },
            },
          'UsageDraftWeighted':
            {
              'type': 'object',
              'required': ['knownTotal', 'missing'],
              'additionalProperties': false,
              'properties':
                {
                  'knownTotal': { 'type': 'number', 'minimum': 0, 'description': '重み付きの量の既知の合計。' },
                  'missing': { 'type': 'integer', 'minimum': 0, 'description': '内訳が不明で合計から除いた行数。' },
                },
            },
          'UsageDraftGroup':
            {
              'type': 'object',
              'required':
                [
                  'repo',
                  'draft',
                  'step',
                  'callTrigger',
                  'provider',
                  'rows',
                  'weighted',
                  'firstAt',
                  'lastAt',
                  'outcome',
                  'desks',
                  'calls',
                  'inputTokens',
                  'outputTokens',
                  'cacheReadTokens',
                  'cacheWriteTokens',
                  'contextReadRequested',
                  'contextReadRepeated',
                ],
              'additionalProperties': false,
              'properties':
                {
                  'provider':
                    {
                      'type': ['string', 'null'],
                      'description': '記録の実行先。無い・空文字はnull。集計の単位に含む。',
                    },
                  'weighted': { '$ref': '#/components/schemas/UsageDraftWeighted' },
                  'firstAt': { 'type': 'string', 'description': 'この組の使用量の行の最も早いat（ISO文字列）。' },
                  'lastAt': { 'type': 'string', 'description': 'この組の使用量の行の最も遅いat（ISO文字列）。' },
                  'outcome':
                    {
                      'type': 'string',
                      'enum':
                        ['filed', 'investigation', 'finished', 'returned_to_todo', 'discarded', 'pending', 'unknown'],
                      'description': '相談の結末（相談ごとに1つ。同じ相談の全行に同じ値）。unknownは記録が無く判別できない（相談を手放した記録より前の破棄を含む）。',
                    },
                  'desks':
                    {
                      'type': 'array',
                      'items': { 'type': 'integer' },
                      'description': '起票したIssueの共通番号。無ければ空配列。',
                    },
                  'repo': { 'type': ['string', 'null'], 'description': 'プロジェクト未定の相談ではnull。' },
                  'draft': { 'type': 'string' },
                  'step': { 'type': 'string', 'enum': ['受付の相談', '代理の回答', '起票直前の重複と依存の確認', '相談の下書き', 'filingCheck', '利用者への質問の代理確認'], 'description': '出力は旧名にそろえる。新名は受け付ける表記として列挙。' },
                  'callTrigger':
                    {
                      'type': ['string', 'null'],
                      'enum':
                        [
                          'initial',
                          'user_reply',
                          'context_read',
                          'automatic_continuation',
                          'failure_retry',
                          'recovery_continuation',
                          'ai_message_continuation',
                          'format_repair',
                          'rate_limit_retry',
                          'filing_recompare',
                          null,
                        ],
                      'description': '受付が記録する呼び出し契機。未記録の古い行はnull。',
                    },
                  'rows': { 'type': 'integer', 'minimum': 0 },
                  'calls': { '$ref': '#/components/schemas/UsageDraftMetric' },
                  'inputTokens': { '$ref': '#/components/schemas/UsageDraftMetric' },
                  'outputTokens': { '$ref': '#/components/schemas/UsageDraftMetric' },
                  'cacheReadTokens': { '$ref': '#/components/schemas/UsageDraftMetric' },
                  'cacheWriteTokens': { '$ref': '#/components/schemas/UsageDraftMetric' },
                  'contextReadRequested':
                    {
                      '$ref': '#/components/schemas/UsageDraftMetric',
                      'description': '新しい読み足しの要求数。nullの旧行・起票直前確認はmissingへ数え、既知の0と区別する。',
                    },
                  'contextReadRepeated':
                    {
                      '$ref': '#/components/schemas/UsageDraftMetric',
                      'description': '既読の再要求数。nullの旧行・起票直前確認はmissingへ数え、既知の0と区別する。',
                    },
                },
            },
          'ConsultationBudgetPeriod':
            {
              'type': 'object',
              'required': ['stoppedDrafts', 'stops', 'continuations'],
              'properties':
                {
                  'stoppedDrafts':
                    { 'type': 'integer', 'minimum': 0, 'description': '期間中に停止した相談の数。同じ相談は1件。' },
                  'stops': { 'type': 'integer', 'minimum': 0, 'description': '期間中の停止回数。' },
                  'continuations':
                    {
                      'type': 'integer',
                      'minimum': 0,
                      'description': '期間中に利用者が続行した回数。再送は含めない。',
                    },
                },
            },
          'ConsultationBudgetStats':
            {
              'type': 'object',
              'required': ['before', 'after', 'reason'],
              'description': '下書きの停止・続行履歴を操作時刻で前後の期間ごとに集計。project指定で絞る。読取失敗は両期間nullと理由を返し、他の表は継続。',
              'properties':
                {
                  'before':
                    { 'oneOf': [{ '$ref': '#/components/schemas/ConsultationBudgetPeriod' }, { 'type': 'null' }] },
                  'after':
                    { 'oneOf': [{ '$ref': '#/components/schemas/ConsultationBudgetPeriod' }, { 'type': 'null' }] },
                  'reason': { 'type': ['string', 'null'] },
                },
            },
          'UsageDraftStats':
            {
              'type': 'array',
              'description': 'repo・draft・step・callTriggerごとの集計。期間・projectで絞り、空なら空配列。',
              'items': { '$ref': '#/components/schemas/UsageDraftGroup' },
            },
          'UsageSessionGroup':
            {
              'type': 'object',
              'additionalProperties': false,
              'required':
                [
                  'provider',
                  'sessionMode',
                  'order',
                  'rows',
                  'inputTokens',
                  'cacheReadTokens',
                  'outputTokens',
                  'cacheWriteTokens',
                  'weighted',
                  'modelCalls',
                  'contextMaxTokens',
                ],
              'properties':
                {
                  'provider': { 'type': ['string', 'null'] },
                  'sessionMode': { 'type': ['string', 'null'], 'enum': ['new', 'resumed', 'once', null] },
                  'order':
                    {
                      'type': 'integer',
                      'minimum': 1,
                      'maximum': 10,
                      'description': '期間・projectで絞った相談行のrepo・draftごとのat昇順の位置。同時刻はDB読み出し順。10は10回目以降。sessionCallとは別。',
                    },
                  'rows': { 'type': 'integer', 'minimum': 1 },
                  'inputTokens': { '$ref': '#/components/schemas/UsageDraftMetric' },
                  'cacheReadTokens': { '$ref': '#/components/schemas/UsageDraftMetric' },
                  'outputTokens': { '$ref': '#/components/schemas/UsageDraftMetric' },
                  'cacheWriteTokens': { '$ref': '#/components/schemas/UsageDraftMetric' },
                  'weighted': { '$ref': '#/components/schemas/UsageDraftWeighted' },
                  'modelCalls': { '$ref': '#/components/schemas/UsageDraftMetric' },
                  'contextMaxTokens':
                    {
                      'type': ['integer', 'null'],
                      'minimum': 0,
                      'description': '既知の文脈トークン数の最大。全件欠測はnull。',
                    },
                },
            },
          'UsageRepairGroup':
            {
              'type': 'object',
              'additionalProperties': false,
              'required': ['step', 'repairKind', 'repairField', 'rows', 'weighted'],
              'properties':
                {
                  'step': { 'type': 'string', 'enum': ['受付の相談'] },
                  'repairKind':
                    {
                      'type': ['string', 'null'],
                      'enum':
                        [
                          'draft_format',
                          'split_over_limit',
                          'repeated_read',
                          'reviewed_unconfirmed',
                          'no_reviewed_body',
                          'implementation_unchecked',
                          'execution_plan',
                          'completion_plan',
                          'acceptance',
                          'change_scope',
                          null,
                        ],
                    },
                  'repairField':
                    {
                      'type': ['string', 'null'],
                      'maxLength': 80,
                      'pattern': "^[A-Za-z0-9]+(?:\\.[A-Za-z0-9]+)*(?![\\s\\S])",
                      'description': 'draft_formatだけの欄名。配列の添字・値・本文は含めない。それ以外はnull。',
                    },
                  'rows': { 'type': 'integer', 'minimum': 1 },
                  'weighted': { '$ref': '#/components/schemas/UsageDraftWeighted' },
                },
            },
          'UsageMissingCommandItems':
            {
              'type': 'array',
              'maxItems': 20,
              'description': 'missingCommands の名前ごとの回数。回数の降順、同数なら名前の昇順で上位20種。不明の名前は ?。本文・引数・パスは含まない。',
              'items':
                {
                  'type': 'object',
                  'required': ['name', 'count'],
                  'additionalProperties': false,
                  'properties':
                    {
                      'name':
                        { 'type': 'string', 'maxLength': 64, 'pattern': "^(?:[A-Za-z0-9._+-]{1,64}|\\?)(?![\\s\\S])" },
                      'count': { 'type': 'integer', 'minimum': 1 },
                    },
                },
            },
          'UsageToolErrorsPeriod':
            {
              'type': 'object',
              'additionalProperties': true,
              'properties':
                {
                  'drafts': { '$ref': '#/components/schemas/UsageDraftStats' },
                  'sessions':
                    {
                      'type': 'array',
                      'description': 'source=intake・step=受付の相談・draftありの行をdraftsと同じ期間・projectで絞りprovider・sessionMode・order別に集計。provider昇順（nullは空文字）、種類はnew・resumed・once・null、順番は数値昇順。空期間は空配列。欠測を0と推測しない。',
                      'items': { '$ref': '#/components/schemas/UsageSessionGroup' },
                    },
                  'repairs':
                    {
                      'type': 'array',
                      'description': '受付DBのformat_repairの相談行をstep・repairKind・repairField別に集計。draftsと同じ期間・project。旧行の種類はnull。空なら空配列。',
                      'items': { '$ref': '#/components/schemas/UsageRepairGroup' },
                    },
                  'contextReadPaths':
                    {
                      'type': 'array',
                      'maxItems': 200,
                      'description': '受付DBのdraftsと同じ期間・project・対象行から、参照先repo・pathごとに集計。requestedは新しい読み足し、repeatedは既読の再要求。nullや空配列はパスを補わない（欠測はdraftsのmissingで表示）。requested+repeatedの降順、同数はrepo・pathの昇順で上位200組。保存時の各行上位30パスに限る。',
                      'items':
                        {
                          'type': 'object',
                          'additionalProperties': false,
                          'required': ['repo', 'path', 'requested', 'repeated', 'rows', 'drafts'],
                          'properties':
                            {
                              'repo':
                                {
                                  'type': 'string',
                                  'description': '参照先のリポジトリ。相談のprojectとは異なる場合がある。',
                                },
                              'path': { 'type': 'string' },
                              'requested':
                                { 'type': 'integer', 'minimum': 0, 'description': '新しい読み足しの要求数の合計。' },
                              'repeated': { 'type': 'integer', 'minimum': 0, 'description': '既読の再要求数の合計。' },
                              'rows':
                                { 'type': 'integer', 'minimum': 1, 'description': 'このパスが載った使用量行数。' },
                              'drafts':
                                { 'type': 'integer', 'minimum': 1, 'description': '相談のrepo・draftの異なる組数。' },
                            },
                        },
                    },
                  'contextReadPathsOmitted':
                    {
                      'type': 'integer',
                      'minimum': 0,
                      'description': '上位200組を超えて省略した参照先repo・pathの組数。',
                    },
                  'byBilling':
                    {
                      'type': 'array',
                      'description': '期間[from,to)・projectで絞った課金経路別集計。subscriptionは契約の枠、api_creditはAPIクレジット。欄なし・nullはsubscriptionに含める。空期間は空配列。数値は既知値のみ合計し、全件不明はnull、unknownは欠測行数。weightedには既存の重み設定、costUsdには費用補正後の値を使う。subscription、api_creditの順。',
                      'items':
                        {
                          'type': 'object',
                          'required': ['billing', 'count', 'inputTokens', 'outputTokens', 'cacheReadTokens', 'cacheWriteTokens', 'costUsd', 'uncachedInputTokens', 'normalizedCacheWriteTokens', 'weighted', 'cacheWriteNotApplicable', 'unknown'],
                          'properties':
                            {
                              'billing': { 'type': 'string', 'enum': ['subscription', 'api_credit'] },
                              'count': { 'type': 'integer', 'minimum': 1 },
                              'inputTokens': { 'type': ['number', 'null'] },
                              'outputTokens': { 'type': ['number', 'null'] },
                              'cacheReadTokens': { 'type': ['number', 'null'] },
                              'cacheWriteTokens': { 'type': ['number', 'null'] },
                              'costUsd': { 'type': ['number', 'null'] },
                              'uncachedInputTokens': { 'type': ['number', 'null'] },
                              'normalizedCacheWriteTokens': { 'type': ['number', 'null'] },
                              'weighted': { 'type': ['number', 'null'] },
                              'cacheWriteNotApplicable': { 'type': 'integer', 'minimum': 0 },
                              'unknown':
                                {
                                  'type': 'object',
                                  'description': '値が不明で合計から除いた行の件数（0で補わない）。Codexの生cacheWriteTokensの欠測と、公開単価で換算できないCodexのcostUsdの欠測も含む。',
                                  'required': ['inputTokens', 'outputTokens', 'cacheReadTokens', 'cacheWriteTokens', 'costUsd', 'uncachedInputTokens', 'normalizedCacheWriteTokens', 'weighted'],
                                  'additionalProperties': { 'type': 'integer', 'minimum': 0 },
                                },
                            },
                        },
                    },
                  'byStepProvider':
                    {
                      'type': 'array',
                      'description': '期間・projectで絞った工程×実行先の全件集計。空期間は[]。重み付きの量・件数の降順、工程名・実行先名の昇順（nullは空文字として比較）。既知値とunknownの合計は期間totalに一致。steps・modelsも保持する。',
                      'items': { '$ref': '#/components/schemas/UsageStepProvider' },
                    },
                  'toolErrors':
                    {
                      'type': 'object',
                      'description': '道具のエラーの分類ごとの回数。count は toolErrors の記録がある行、unknown は無い行（旧形式・Antigravity を含む。ゼロにしない）。',
                      'required':
                        [
                          'count',
                          'unknown',
                          'total',
                          'items',
                          'steps',
                          'commands',
                          'commandsOmitted',
                          'commandsUnknown',
                        ],
                      'properties':
                        {
                          'count': { 'type': 'integer', 'minimum': 0 },
                          'unknown': { 'type': 'integer', 'minimum': 0 },
                          'total': { 'type': 'integer', 'minimum': 0 },
                          'items': { '$ref': '#/components/schemas/UsageToolErrorItems' },
                          'commands': { '$ref': '#/components/schemas/UsageMissingCommandItems' },
                          'commandsOmitted':
                            {
                              'type': 'integer',
                              'minimum': 0,
                              'description': '上位20種に含めなかった名前の種類数（回数ではない）。',
                            },
                          'commandsUnknown':
                            {
                              'type': 'integer',
                              'minimum': 0,
                              'description': 'missingCommands が無い・null・不正な形式の行数。空オブジェクトは既知のゼロ。',
                            },
                          'steps':
                            {
                              'type': 'array',
                              'items':
                                {
                                  'type': 'object',
                                  'required':
                                    [
                                      'step',
                                      'provider',
                                      'count',
                                      'unknown',
                                      'total',
                                      'items',
                                      'commands',
                                      'commandsOmitted',
                                      'commandsUnknown',
                                    ],
                                  'properties':
                                    {
                                      'step': { 'type': 'string' },
                                      'provider': { 'type': ['string', 'null'] },
                                      'count': { 'type': 'integer', 'minimum': 0 },
                                      'unknown': { 'type': 'integer', 'minimum': 0 },
                                      'total': { 'type': 'integer', 'minimum': 0 },
                                      'items': { '$ref': '#/components/schemas/UsageToolErrorItems' },
                                      'commands': { '$ref': '#/components/schemas/UsageMissingCommandItems' },
                                      'commandsOmitted':
                                        {
                                          'type': 'integer',
                                          'minimum': 0,
                                          'description': 'この工程×実行先の上位20種に含めなかった名前の種類数。',
                                        },
                                      'commandsUnknown':
                                        {
                                          'type': 'integer',
                                          'minimum': 0,
                                          'description': 'この工程×実行先で missingCommands が無い・null・不正な形式の行数。',
                                        },
                                    },
                                },
                            },
                        },
                    },
                },
            },
        },
    },
}
