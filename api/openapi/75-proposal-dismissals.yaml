                                      'fingerprint': { 'type': 'string', 'pattern': '^[a-f0-9]{64}$' },
                                      'title': { 'type': 'string' },
                                      'status': { 'enum': ['dismissed', 'restored'], 'description': '取消経路の削除後も、既存の保存記録との互換のため restored と restoredAt・restoredVia を残す。' },
                                      'reason': { 'type': 'string' },
                                      'dismissedAt': { 'type': 'string', 'format': 'date-time' },
