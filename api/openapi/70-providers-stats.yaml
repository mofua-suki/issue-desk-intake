                ],
              'requestBody':
                {
                  'required': true,
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'required': ['operationId', 'stopCount'],
                              'properties':
                                {
                                  'operationId': { 'type': 'string', 'pattern': '^[a-zA-Z0-9-]{1,128}$' },
                                  'stopCount':
                                    {
                                      'type': 'integer',
                                      'minimum': 1,
                                      'description': 'Alert stopCount or consultationBudget.stops.length; stale stops refused.',
                                    },
                                  'statement':
                                    {
                                      'type': 'string',
                                      'minLength': 8,
                                      'maxLength': 2000,
                                      'description': 'Required for PC tokens: the own chat approval words of the user. Ignored on the screen.',
                                    },
                                  'instructionAt':
                                    {
                                      'type': 'string',
                                      'description': 'Required for PC tokens: when the user gave the approval in the chat (RFC 3339 with a UTC offset and seconds, e.g. 2026-11-11T11:58:00+09:00; not in the future, within 7 days). Ignored on the screen.',
                                    },
                                },
                            },
                        },
                    },
                },
              'responses':
                {
                  '200':
