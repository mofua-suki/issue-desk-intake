              'security': [{ 'screenSession': [], 'csrfToken': [] }, { 'pcToken': [] }],
              'parameters':
                [
                  {
                    'name': 'draftId',
                    'in': 'path',
                    'required': true,
                    'schema': { 'type': 'string', 'format': 'uuid' },
