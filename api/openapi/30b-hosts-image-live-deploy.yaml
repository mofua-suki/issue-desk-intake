      '/api/v1/hosts/{host}/reader-result':
        {
          'post':
            {
              'operationId': 'post_api_v1_hosts_host_reader_result',
              'summary': '読む側の結果を保存',
              'description': 'idh_専用、自分のPCだけ。statusごとの固定reasonと40桁の16進commit・previousだけを受け付ける。余分な項目・不正な値は400。readerHostsの担当外のrepo、またはそのrepoでdeployedの記録がないcommitは409。拒否時は保存しない。同じ結果は再送可、host・repo単位で最新結果を上書きする。応答はhost・repo・statusだけで本文を返さない。',
              'x-issue-desk-delegate': false,
              'security': [{ 'hostdToken': [] }],
              'parameters': [{ 'name': 'host', 'in': 'path', 'required': true, 'schema': { 'type': 'string' } }],
              'responses':
                {
                  '200':
                    {
                      'description': '一覧または結果の受領。',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                {
                                  'type': 'object',
                                  'properties':
                                    {
                                      'host': { 'type': 'string' },
                                      'repo': { 'type': 'string' },
                                      'status':
                                        { 'type': 'string', 'enum': ['synced', 'skipped', 'rolled_back', 'failed'] },
                                    },
                                  'required': ['host', 'repo', 'status'],
                                  'additionalProperties': false,
                                },
                            },
                        },
                    },
                  '400': { '$ref': '#/components/responses/Error400' },
                  '401': { '$ref': '#/components/responses/Error401' },
                  '403': { '$ref': '#/components/responses/Error403' },
                  '405': { '$ref': '#/components/responses/Error405' },
                  '409': { '$ref': '#/components/responses/Error409' },
                  '503': { '$ref': '#/components/responses/Error503' },
                },
              'requestBody':
                {
                  'required': true,
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'properties':
                                {
                                  'repo': { 'type': 'string', 'pattern': "^[\\w.-]+/[\\w.-]+$" },
                                  'commit': { 'type': 'string', 'pattern': '^[a-fA-F0-9]{40}$' },
                                  'status':
                                    { 'type': 'string', 'enum': ['synced', 'skipped', 'rolled_back', 'failed'] },
                                  'reason':
                                    {
                                      'type': 'string',
                                      'enum':
                                        [
                                          'healthy',
                                          'dirty',
                                          'detached',
                                          'diverged',
                                          'ahead',
                                          'not_on_default',
                                          'not_allowed',
                                          'rollback_healthy',
                                          'rollback_check_failed',
                                          'rollback_failed',
                                          'preflight_failed',
                                          'interrupted',
                                        ],
                                    },
                                  'previous': { 'type': 'string', 'pattern': '^[a-fA-F0-9]{40}$' },
                                },
                              'required': ['repo', 'commit', 'status', 'reason'],
                              'additionalProperties': false,
                              'oneOf':
                                [
                                  {
                                    'properties':
                                      { 'status': { 'const': 'synced' }, 'reason': { 'enum': ['healthy'] } },
                                  },
                                  {
                                    'properties':
                                      {
                                        'status': { 'const': 'skipped' },
                                        'reason':
                                          {
                                            'enum':
                                              [
                                                'dirty',
                                                'detached',
                                                'diverged',
                                                'ahead',
                                                'not_on_default',
                                                'not_allowed',
                                              ],
                                          },
                                      },
                                  },
                                  {
                                    'properties':
                                      {
                                        'status': { 'const': 'rolled_back' },
                                        'reason': { 'enum': ['rollback_healthy', 'rollback_check_failed'] },
                                      },
                                  },
                                  {
                                    'properties':
                                      {
                                        'status': { 'const': 'failed' },
