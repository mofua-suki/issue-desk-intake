                  '405': { '$ref': '#/components/responses/Error405' },
                  '409': { '$ref': '#/components/responses/Error409' },
                  '503': { '$ref': '#/components/responses/Error503' },
                },
              'requestBody':
                {
                  'required': true,
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'additionalProperties': false,
                              'required': ['id', 'result'],
                              'properties':
                                {
                                  'id': { 'type': 'integer', 'minimum': 1 },
                                  'result':
                                    {
                                      'type': 'object',
                                      'additionalProperties': false,
                                      'required': ['pass', 'summary', 'metrics', 'failures'],
                                      'properties':
                                        {
                                          'pass': { 'type': 'boolean' },
