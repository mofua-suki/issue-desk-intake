              'operationId': 'get_api_v1_hosts_host_reader_next',
              'summary': '読む側の配備済みコミットを取得',
              'description': 'idh_専用、自分のPCだけ。readerHostsのリポジトリごとに最新の配備IDでstatus=deployedのコミットを返す。queued・running・rolled_back・failedは除外。担当外のPCはjobs: []。パス・コマンド・URLは返さない。',
              'x-issue-desk-delegate': false,
              'security': [{ 'hostdToken': [] }],
              'parameters': [{ 'name': 'host', 'in': 'path', 'required': true, 'schema': { 'type': 'string' } }],
