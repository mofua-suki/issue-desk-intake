{
  'paths':
    {
      '/api/intake/force-handoff':
        {
          'post':
            {
              'operationId': 'post_api_intake_force_handoff',
              'summary': '利用者依頼の強制入れ替え要求を保存する',
              'description': '運用の代行を許したPC別トークン専用。画面セッション・一時キーは拒否。利用者の発言原文statement（8〜8000文字、meaningfulApprovalStatement）と、利用者がチャットで指示した日時instructionAt（UTCオフセット付きISO 8601（秒まで。例 2026-11-11T11:58:00+09:00）、未来でなく7日以内。欠ける・不正は400）と任意の40桁小文字SHA revision。発行から1800秒の1回限りの要求を保存する。この段階は要求受付のみで、NASによる消費・強制交代、CLI・運用Skillは後続。反映までは実操作に使わない。現在のNAS更新動作は変えない。成功は保存完了で実行完了ではない。発言・指示の日時・トークン名・時刻はintake.logへ資格情報なしで記録する。',
              'x-issue-desk-delegate': true,
              'security': [{ 'pcToken': [] }],
              'requestBody':
                {
                  'required': true,
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'required': ['statement', 'instructionAt'],
                              'additionalProperties': false,
                              'properties':
                                {
                                  'statement': { 'type': 'string', 'minLength': 8, 'maxLength': 8000 },
                                  'instructionAt':
                                    {
                                      'type': 'string',
                                      'description': '利用者がチャットで指示した日時（UTCオフセット付きISO 8601（秒まで。例 2026-11-11T11:58:00+09:00）、未来でなく7日以内）。',
                                    },
                                  'revision': { 'type': 'string', 'pattern': '^[a-f0-9]{40}$' },
                                },
                            },
                        },
                    },
                },
              'responses':
                {
                  '200':
                    {
                      'description': '要求を保存。期限はUnix秒。',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                {
                                  'type': 'object',
                                  'properties':
                                    {
                                      'id': { 'type': 'string' },
                                      'issuedAt': { 'type': 'integer' },
                                      'expiresAt': { 'type': 'integer' },
                                      'revision': { 'type': ['string', 'null'] },
                                    },
                                  'required': ['id', 'issuedAt', 'expiresAt', 'revision'],
                                  'additionalProperties': false,
                                },
                            },
                        },
                    },
                  '400': { '$ref': '#/components/responses/Error400' },
                  '401': { '$ref': '#/components/responses/Error401' },
                  '403': { '$ref': '#/components/responses/Error403' },
                  '502': { 'description': '保存または監査の失敗。自動再送しない。' },
                },
            },
        },
      '/api/v1/hosts/{host}/image-result':
        {
          'post':
            {
              'operationId': 'post_api_v1_hosts_host_image_result',
              'summary': 'イメージ更新の結果を送る',
              'description': '自分のPCだけ。desiredはDB行またはnull。deploy-nextのjobは{id,repo,commit}またはnull、未報告のrunningを再返却。image-resultのtagはsha12と任意の接尾辞、digestはsha256:64桁。失敗タグは成功の再報告で解除しない。',
              'x-issue-desk-delegate': false,
              'security': [{ 'hostdToken': [] }],
              'responses':
                {
                  '200':
                    {
                      'description': '受付の応答。',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                {
                                  'type': 'object',
                                  'properties': { 'host': {}, 'status': {} },
                                  'additionalProperties': true,
                                },
                            },
                        },
                    },
                  '400': { '$ref': '#/components/responses/Error400' },
                  '401': { '$ref': '#/components/responses/Error401' },
                  '403': { '$ref': '#/components/responses/Error403' },
                  '404': { '$ref': '#/components/responses/Error404' },
                  '405': { '$ref': '#/components/responses/Error405' },
                  '409': { '$ref': '#/components/responses/Error409' },
                  '502': { '$ref': '#/components/responses/Error502' },
                  '503': { '$ref': '#/components/responses/Error503' },
                },
              'parameters': [{ 'name': 'host', 'in': 'path', 'required': true, 'schema': { 'type': 'string' } }],
              'requestBody':
                {
                  'required': true,
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'properties':
                                {
                                  'tag': { 'type': 'string' },
                                  'flavor': { 'type': 'string', 'enum': ['', '-python'] },
                                  'digest': { 'type': 'string' },
                                  'status': { 'type': 'string', 'enum': ['success', 'failed'] },
                                  'stage': { 'type': 'string', 'enum': ['recover', 'docker', 'client', 'swap-finish', 'acquire', 'swap-start', 'apps', 'complete'] },
                                  'reason': { 'type': 'string', 'description': 'NULを含まないUTF-8で200バイト以下。秘匿後も200バイト以下で保存。表示時は別途上限を適用する。' },
                                  'detail': { 'type': 'string', 'description': 'NULを含まないUTF-8で200バイト以下。秘匿後も200バイト以下で保存。表示時は別途上限を適用する。' },
                                  'selfCheckFailed': { 'type': 'array', 'maxItems': 40, 'items': { 'type': 'string', 'description': 'NULを含まないUTF-8で200バイト以下。秘匿後も200バイト以下で保存。表示時は別途上限を適用する。' } },
                                  'fromTag': { 'type': 'string', 'pattern': '^[0-9a-f]{12}(-[a-z0-9-]+)?$' },
                                  'startedAt': { 'type': 'string', 'format': 'date-time', 'description': 'RFC3339日時。表記上とUTC換算後の年は0001〜9999。' },
                                },
                              'additionalProperties': false,
                              'required': ['tag', 'flavor', 'digest', 'status'],
                            },
                        },
                    },
                },
            },
        },
      '/api/v1/hosts/{host}/live-check-next':
