                {
                  '200':
                    {
                      'description': '確認ジョブまたは報告の受領。',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                {
                                  'type': 'object',
                                  'properties': { 'ok': { 'type': 'boolean' } },
