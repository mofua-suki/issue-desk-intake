                                      'description': '相談の途中の難易度の変更（light: 低、standard: 中、heavy: 高。省略可、3値以外は400）。新しい発言・retryのとき次のターンからその難易度のモデル・推論レベルで動く。同じ難易度・intake.tiersが無い（level=fixed）ときは変えない。廃止前の始めの判定待ちの記録（pending）は外す。tier.historyに{from,to,reason,at,source:user}を追記し、最上位のsource・reason・decidedAtは出発点のまま。同じid/messageIdの再送・断る状態では変えない。画面・一時キー・トークン接続（自分の相談）で使える。',
                                    },
