              'operationId': 'post_api_drafts_id_chat',
              'summary': '相談のchat',
              'description': '外部照合が必要な画面/一時キーの初回発言は、検査後に本文・送り手・指定値・再開状態を永続受領してから202を返す。受付IDは別に発行し、idは従来の下書きID、requestIdは送信id（未指定ならmessageId）、draftIdはこの発言保存前はnull。保存失敗時は成功を返さない。同じ送信IDの別内容・指定値は409（code=send_id_conflict）。受付IDもGET /api/drafts/{id}で読める。受領後に既存処理へ渡し、後続回答・retryは従来の同期保存を保つ。相談の呼び出し上限で停止中（consultationBudget.stopped）は返信・retry・同じ送信IDの再送とも409で断り、発言を追加しない。利用者が受付画面の要対応から続行を選ぶか、チャットでの利用者の承認の発言を添えて運用代行のトークンで続行を送る（POST /api/attention/consultation-budget/{draftId}/continue）。chatは同じid/messageIdで照合。通常のトークンは自分の相談だけ。他人のchatは運用代行が必要。finishは運用代行を許したトークンだけ。トークンでは編集・priorityは403。proxy-undoは運用代行を許したトークンが利用者の承認の発言（statement）と指示の日時（instructionAt）を添えたときだけ受け付け、proxyUndosに発言・日時・経路・送信元PCを記録する。状態の可否はactionsで確かめる。受付画面・一時キーの経路では、利用者の発言がまだ無い下書きへの最初の発言（retryでない）に限り、受付AIを呼ぶ前に同じプロジェクトの開いている依頼・相談中の下書き・TODOを比較する。停止候補と弱い手がかりをduplicateHintsとして相談の文脈へ渡し、候補があっても409で拒否せず、発言と受付AIのターンを開始する。運用の代行を許していない場合は所有者別に見える範囲の候補だけを渡す。notDuplicateは候補確認を省略せず、互換記録用として理由を同じ下書きへ記録する（前後の空白を除き1〜500文字。空白だけ・500文字超・文字列以外は400）。2件目以降の発言・retry・トークン接続のchatでは候補確認をしない。 expectedRevisionは任意の0以上の安全整数。不正値は400。新しい回答の保存時に現在のrevisionと異なれば409で会話・質問の再読を求める。同一id/messageId・本文・画像の再送は版照合より先に照合し重複保存しない。retryは版照合しない。省略した旧クライアントは従来どおり受理する。',
