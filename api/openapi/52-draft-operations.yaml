      '/api/drafts/{id}/submit':
        {
          'post':
            {
              'operationId': 'post_api_drafts_id_submit',
              'summary': '相談のsubmit',
              'description': '認証・持ち主・hold・revision・操作の可否を検査し、起票の意図を保存してHTTP 202を返す（accepted=true・id=下書きID・status=auto_ready）。AI照合・Gitea投稿は応答内で行わず、受理直後にEngineの寿命管理で処理し、既存の起票再開周期（1分）または再起動時にも回収する。同じ確定元revisionの再送は同じ意図を返し二重起票しない。GET /api/drafts/{id} を照会し、submittedかつissue/issuesがあることを完了条件とする。以下の起票時の拒否・失敗はGETでerror/errorCodeから確認する。Issue作成が確定HTTP 423で拒否されたときだけ保管状態を照会する。保管済みならsubmit_errorとrepositoryStops（宛先・理由・案内・日時）を同時に保存し409 repository_archivedを返す。表示エラーを消しても同じ宛先への新規作成を止め、登録済みの別プロジェクト選択または終了を案内する。別の宛先には停止を適用しない。非保管423は502 repository_locked、保管状態の欠落・型不正・照会失敗は502 repository_archive_unverifiedとして区別し、保管による停止を保存せず再試行できる。作成済みIssueの回収・結果不明照合・保存済みjob復元は停止検査より先に行う。履歴読取や添付の423は保管判定に使わない。前提不足の補完相談はPOST直前に既存依頼と保存済み照合根拠を再確認する。候補変更・照合未確定・補完相談の分割は409で拒否し、IssueのPOSTとattemptedの確定を行わない。表示した照合相談で既存依頼へ接続するか、不在を再照合して同じ補完相談を再送する。送信済み・結果不明は既存の照合を維持する。受付交代のclosingは外部drainの解除後も新しい起票を抑止する。起票枠取得・AI確認・POST直前で未送信の処理は409となり、submit_errorと中断理由を保存する。交代後の再送または次の起動時のrecoverで続け、送信済みの照合・後片付けは維持する。置き換え指定がある場合、個別取得と後続の依存グラフ用スナップショットの両方で全置き換え元のジョブ状態を検証する。ジョブ未確認・未知状態・running・publishing・implementingなら409で拒否し、置き換えIssueのPOSTは行わない。比較資料のjobStatusには検証済みスナップショットの値を渡す。トークン接続は、自分のトークンで始めた相談のうち hold（相談だけのモード。POST /api/issues の hold=true）の確定待ちだけを確定できる（scripts/create-issue.ts --draft <ID> --submit）。hold でない相談は403、他のトークンの相談は404、revision が違えば409。basisConflicts が残る相談は409 DECISION_BASIS_MISMATCH で確定を拒否する。全件requester_factなら recovery.action=correct_requester_facts とし、判断を取り直さず依頼者が同じ相談へ訂正を返信して再照合する。user_decision・分類欠落・不正・混在ならreconfirm_decisionとし、訂正した事実と判断への影響を示して判断を取り直す。解消後に確定する。運用の代行を許したトークンは従来どおり持ち主・holdを問わず確定できる。起票せずに終えた子（finishedWithoutIssue=true）がいる分割の親の再送は409で断り、残りの子を「終える」へ案内する。chatは同じid/messageIdで照合。通常のトークンは自分の相談だけ。他人のchatは運用代行が必要。finishは運用代行を許したトークンだけ。トークンでは編集・priorityは403。proxy-undoは運用代行を許したトークンが利用者の承認の発言（statement）と指示の日時（instructionAt）を添えたときだけ受け付け、proxyUndosに発言・日時・経路・送信元PCを記録する。状態の可否はactionsで確かめる。',
              'x-issue-desk-delegate': true,
