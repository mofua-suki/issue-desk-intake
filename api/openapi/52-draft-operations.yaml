              'operationId': 'post_api_drafts_id_finish',
              'summary': '起票せずに相談を終える（記録を保持）',
              'description': '通常の未起票のdraft・intake_waiting・submit_error・error・stalled・investigating・investigation_ready・investigation_errorと実行中を含むthinking・auto_readyをsubmittedにし記録を保持する。終了の保存と起票開始は排他的で、終了の保存が先なら後続のAI保存・自動起票・復旧再開を行わない。submittingの保存が先なら409で拒否し、GET /api/drafts/{id}で起票結果を確認する。起票済みIssueがある場合と通常のsubmit_unknownも409で拒否し、結果不明は対象リポジトリも照合する。調査Issueは保持する。分割家族は処理中・closedを拒否する。全て未起票の家族は親子を終了する。一部起票済みの家族では、issue.numberまたはsubmittedのissues中の有効な起票結果を持つ子を起票済みとして保持し、終了可能な未起票の子を終了する。親のissuesに起票結果をproject付きで集約し、issueを先頭にする。子の個別終了で全子が起票済みか起票せず終了済みになった場合も親を終了する。親子はトランザクションで保存し失敗時は更新しない。起票済みの子・配下・外部Issueは変更しない。運用代行を許したPC別トークンはinstructionAtが必須。UTCオフセット付きRFC3339日時で、未来は400、相談作成より前の指示または作成時刻を確認できない場合は409。画面・一時キーではinstructionAtは任意。200は終了の保存完了を意味し、原文・添付・使用量・了承記録を保持する。保存失敗は成功として返さない。',
              'x-issue-desk-delegate': true,
