                                  'id': { 'type': 'string' },
                                  'messageId': { 'type': 'string' },
                                  'text': { 'type': 'string' },
                                  'approvalFingerprint': { 'type': 'string', 'description': '運用代行PCが了承する提示対象の指紋。' },
                                  'statement': { 'type': 'string', 'description': '組の変更または除外例外の了承を運用代行PCから送る場合の利用者の承認発言。' },
                                  'instructionAt': { 'type': 'string', 'description': 'その発言の日時（UTCオフセット付き）。' },
