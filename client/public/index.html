<!doctype html>
<html lang="ja" data-ui="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#152c43" />
    <title>開発受付</title>
    <link rel="icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="開発受付 ホーム"
        ><span class="brand-icon">↗</span><span>開発受付<small>ISSUE DESK</small></span></a
      ><span id="connection" class="connection">接続を確認中</span
      ><button id="connection-toggle" class="connection-toggle" type="button" aria-expanded="false">確認中</button
      ><button id="phone" class="quiet" hidden>スマホで開く</button>
    </header>
    <div id="update" role="status" aria-live="polite" hidden></div>
    <div id="notice" role="alert" hidden></div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <main id="app"><div class="loading">受付を開いています…</div></main>
    <dialog id="phone-dialog">
      <form method="dialog"><button class="close quiet" aria-label="閉じる">×</button></form>
      <span class="eyebrow">YOUR PHONE</span>
      <h2>スマホを接続する</h2>
      <div id="phone-content"></div>
    </dialog>
    <footer>
      依頼と実行結果はGiteaに保存されます。必要な確認が完了すると自動起票し、実装へ進みます。要対応タブで質問や失敗を確認できます。
    </footer>
  </body>
</html>
